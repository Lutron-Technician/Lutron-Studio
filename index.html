<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lutron Technician – Architectural Studio & Audio Player</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(18, 22, 33, 0.92);
      --amber-warm: #ffaa33;
      --qs-blue: #00d2ff;
      --led-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #8a94a6;
      --border-light: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      
      --fixture-color: #ff8800;
      --fixture-glow: rgba(255, 136, 0, 0.75);
      --ambient-dim: 0.85;
      --drapery-pos: 0%;
      --drapery-opacity: 0.95;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Architectural Studio Lighting & Stage Canvas */
    .studio-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, rgba(30, 41, 59, 0.6) 0%, #05070a 100%);
      transition: background 1.2s ease;
    }

    .curtain-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(90deg, #11141d 0px, #1a202c 35px, #0b0d13 70px);
      opacity: var(--drapery-opacity);
      transform: translateY(var(--drapery-pos));
      transition: transform 1.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.5s ease;
      box-shadow: inset 0 -60px 100px rgba(0,0,0,0.95);
    }

    .lighting-fixture-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .light-cone-left, .light-cone-right {
      position: absolute;
      top: -20px;
      width: 140px;
      height: 85vh;
      background: linear-gradient(180deg, var(--fixture-color) 0%, rgba(0,0,0,0) 80%);
      opacity: var(--ambient-dim);
      filter: blur(35px);
      transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .light-cone-left { left: 22%; transform: rotate(4deg); }
    .light-cone-right { right: 22%; transform: rotate(-4deg); }

    .fixture-head {
      position: absolute;
      top: 35px;
      width: 28px;
      height: 14px;
      background: #2d3748;
      border-radius: 4px;
      box-shadow: 0 0 20px var(--fixture-glow);
      transition: box-shadow 1.2s ease;
    }
    .fixture-head::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 6px;
      width: 16px;
      height: 16px;
      background: var(--fixture-color);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--fixture-glow);
    }
    .head-left { left: calc(22% + 56px); }
    .head-right { right: calc(22% + 56px); }

    /* Top Technical Header */
    header {
      position: relative;
      z-index: 10;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .title-group h1 {
      font-family: 'Syncopate', sans-serif;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 5px;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255,255,255,0.25);
    }

    .title-group p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: #cbd5e1;
      margin-top: 5px;
      text-transform: uppercase;
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #94a3b8;
      letter-spacing: 1px;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--led-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--led-green);
    }

    /* Main UI Split: Lutron Palladiom Keypad */
    .main-workspace {
      position: relative;
      z-index: 10;
      display: flex;
      padding: 10px 40px;
    }

    .keypad-column {
      width: 280px;
    }

    .lutron-palladiom {
      background: linear-gradient(145deg, rgba(22, 27, 39, 0.94), rgba(10, 13, 20, 0.98));
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 18px 14px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(255,255,255,0.1);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .keypad-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 14px 16px;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .keypad-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(3px);
    }

    .keypad-btn.active {
      background: linear-gradient(90deg, rgba(255, 170, 51, 0.15), rgba(255, 170, 51, 0.02));
      border-color: var(--amber-warm);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 170, 51, 0.2);
    }

    .keypad-led {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #334155;
      transition: all 0.3s ease;
    }

    .keypad-btn.active .keypad-led {
      background: var(--amber-warm);
      box-shadow: 0 0 8px var(--amber-warm), 0 0 12px var(--amber-warm);
    }

    /* Fixed Bottom Player Deck (Locked on screen) */
    footer.player-deck-container {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 9999 !important;
      width: 90% !important;
      max-width: 880px !important;
    }

    .player-deck {
      background: rgba(15, 20, 30, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 9px 14px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--amber-warm);
    }

    .search-btn {
      background: #f97316;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }
    .search-btn:hover {
      background: #fb923c;
      transform: scale(1.02);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 50%;
      overflow: hidden;
    }

    .track-icon {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .track-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .track-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transport-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .play-btn {
      background: #f97316;
      border: none;
      color: #000;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      transition: transform 0.15s, background 0.2s;
    }
    .play-btn:hover {
      transform: scale(1.05);
      background: #fb923c;
    }

    .playlist-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px 12px;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .playlist-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Fixed Floating Playlist Drawer (Locked) */
    #playlistDrawer {
      position: fixed !important;
      bottom: 110px !important;
      right: calc(50% - 440px + 20px) !important;
      width: 380px;
      max-height: 380px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      z-index: 10000 !important;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #playlistDrawer.open {
      display: flex;
    }

    .playlist-scroll-area {
      overflow-y: auto;
      max-height: 310px;
      padding: 6px;
    }

    .playlist-scroll-area::-webkit-scrollbar {
      width: 5px;
    }
    .playlist-scroll-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .playlist-item {
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #cbd5e1;
      border: 1px solid transparent;
      margin-bottom: 4px;
      background: rgba(255, 255, 255, 0.02);
      transition: background 0.2s;
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
    }

    .playlist-item.active-track {
      background: rgba(249, 115, 22, 0.15);
      border-color: rgba(249, 115, 22, 0.4);
      color: #f97316;
    }

    #yt-player-container {
      position: absolute;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
      opacity: 0;
    }

    @media (max-width: 950px) {
      #playlistDrawer {
        right: 5% !important;
        width: 90% !important;
        max-width: 380px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Lighting & Architectural Drapery Viewport -->
  <div class="studio-viewport" id="viewport">
    <div class="curtain-backdrop" id="curtain"></div>
    <div class="lighting-fixture-container">
      <div class="light-cone-left" id="coneLeft"></div>
      <div class="light-cone-right" id="coneRight"></div>
      <div class="fixture-head head-left" id="headLeft"></div>
      <div class="fixture-head head-right" id="headRight"></div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="title-group">
      <h1>LUTRON TECHNICIAN</h1>
      <p>System Programmer • Architectural Lighting & Motorized Drapery</p>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="activeSceneText">SCENE 03: AMBIENT 2700K KELVIN</span>
    </div>
  </header>

  <!-- Workspace: Keypad -->
  <div class="main-workspace">
    <div class="keypad-column">
      <div class="lutron-palladiom" id="keypad">
        <button class="keypad-btn" data-scene="bright">
          <span>01 BRIGHT</span>
          <span class="keypad-led"></span>
        </button>
        <button class="keypad-btn" data-scene="dim">
          <span>02 DIM / MOVIE</span>
          <span class="keypad-led"></span>
        </button>
        <button class="keypad-btn active" data-scene="ambient">
          <span>03 AMBIENT 2700K</span>
          <span class="keypad-led"></span>
        </button>
        <button class="keypad-btn" data-scene="dali_blue">
          <span>04 DALI BLUE</span>
          <span class="keypad-led"></span>
        </button>
        <button class="keypad-btn" data-scene="drapery">
          <span id="draperyBtnText">05 DRAPERY: OPEN</span>
          <span class="keypad-led"></span>
        </button>
        <button class="keypad-btn" data-scene="off">
          <span>06 ALL OFF</span>
          <span class="keypad-led"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Playlist Drawer -->
  <div id="playlistDrawer"></div>

  <!-- Bottom Player Console Deck -->
  <footer class="player-deck-container">
    <div class="player-deck">
      <div class="search-row">
        <input type="text" id="songQueryInput" class="search-input" placeholder="Search ANY studio song (e.g. Hindi, Romantic, 90s, Arijit)...">
        <button id="searchSubmitBtn" class="search-btn">SEARCH</button>
      </div>
      <div class="controls-row">
        <div class="track-meta">
          <div class="track-icon">🎵</div>
          <div class="track-details">
            <div class="track-name" id="currentTrackTitle">Pehle Bhi Main — Animal</div>
            <div class="track-artist" id="currentTrackArtist">YouTube HD Master Audio</div>
          </div>
        </div>
        <div class="transport-btns">
          <button class="icon-btn" id="prevTrackBtn">⏮</button>
          <button class="play-btn" id="masterPlayBtn">▶</button>
          <button class="icon-btn" id="nextTrackBtn">⏭</button>
        </div>
        <button class="playlist-toggle-btn" id="playlistToggleBtn">📑 SONGS</button>
      </div>
    </div>
  </footer>

  <!-- Invisible YouTube Audio Engine Container -->
  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <script>
    // --- 1. LUTRON LIGHTING & DRAPERY SCENES ---
    const root = document.documentElement;
    const sceneLabel = document.getElementById('activeSceneText');
    const draperyBtnLabel = document.getElementById('draperyBtnText');
    let isDraperyClosed = false;

    const scenes = {
      bright: {
        color: '#fff3d1',
        glow: 'rgba(255, 243, 209, 0.95)',
        dim: '1.0',
        label: 'SCENE 01: 100% FULL BRIGHT ARCHITECTURAL'
      },
      dim: {
        color: '#e65100',
        glow: 'rgba(230, 81, 0, 0.7)',
        dim: '0.45',
        label: 'SCENE 02: CINEMA DIM 15% WARM GLOW'
      },
      ambient: {
        color: '#ff8800',
        glow: 'rgba(255, 136, 0, 0.75)',
        dim: '0.85',
        label: 'SCENE 03: AMBIENT 2700K KELVIN'
      },
      dali_blue: {
        color: '#00d2ff',
        glow: 'rgba(0, 210, 255, 0.85)',
        dim: '0.9',
        label: 'SCENE 04: DALI ARCHITECTURAL BLUE ACCENT'
      },
      off: {
        color: '#000000',
        glow: 'rgba(0, 0, 0, 0)',
        dim: '0.05',
        label: 'SCENE 06: ALL FIXTURES OFF (ZERO CONSUMPTION)'
      }
    };

    function applyLightingScene(sceneKey, btnElement) {
      if (sceneKey === 'drapery') {
        isDraperyClosed = !isDraperyClosed;
        root.style.setProperty('--drapery-pos', isDraperyClosed ? '0%' : '-100%');
        root.style.setProperty('--drapery-opacity', isDraperyClosed ? '0.95' : '0.15');
        draperyBtnLabel.innerText = isDraperyClosed ? '05 DRAPERY: CLOSED' : '05 DRAPERY: OPEN';
        sceneLabel.innerText = isDraperyClosed ? 'SCENE 05: MOTORIZED DRAPERY CLOSED' : 'SCENE 05: MOTORIZED DRAPERY OPEN';
        if (btnElement) btnElement.classList.toggle('active', isDraperyClosed);
        return;
      }

      const conf = scenes[sceneKey];
      if (!conf) return;

      root.style.setProperty('--fixture-color', conf.color);
      root.style.setProperty('--fixture-glow', conf.glow);
      root.style.setProperty('--ambient-dim', conf.dim);
      sceneLabel.innerText = conf.label;

      document.querySelectorAll('.keypad-btn').forEach(b => {
        if (b.getAttribute('data-scene') !== 'drapery') b.classList.remove('active');
      });
      if (btnElement) btnElement.classList.add('active');
    }

    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyLightingScene(btn.getAttribute('data-scene'), btn);
      });
    });

    // --- 2. MULTI-PLAYLIST & LOCALSTORAGE STATE ---
    let currentViewTab = 'search';
    let activePlaylistName = 'Mood';
    let currentTrackIndex = 0;
    let isPlaying = false;
    let player = null;

    let songsList = [
      { id: '1fueZCTYkpA', name: 'Pehle Bhi Main — Vishal Mishra', artist: 'YouTube Live Audio' },
      { id: '3v3b1Z1Kk8M', name: 'Dhundla — Official Audio', artist: 'YouTube Live Audio' },
      { id: 'qYmXz7tM9vQ', name: 'Bairan — New Haryanvi Song', artist: 'YouTube Live Audio' },
      { id: 'H5v3kku4y6Q', name: 'Arijit Singh Studio Mashup', artist: 'YouTube Live Audio' },
      { id: 'fRh_vgS2dFE', name: 'Sorry — Justin Bieber (Acoustic)', artist: 'YouTube Live Audio' }
    ];

    function getAllPlaylists() {
      let data = localStorage.getItem('lutron_custom_playlists');
      if (data) {
        try { return JSON.parse(data); } catch(e){}
      }
      return { 'Mood': JSON.parse(localStorage.getItem('my_custom_mood') || '[]') };
    }

    function saveAllPlaylists(data) {
      localStorage.setItem('lutron_custom_playlists', JSON.stringify(data));
    }

    function createNewPlaylist() {
      let name = prompt("Nayi Playlist ka naam enter karein (e.g. 90s, Party, Romantic):");
      if (!name || !name.trim()) return;
      let cleanName = name.trim();
      let all = getAllPlaylists();
      if (!all[cleanName]) {
        all[cleanName] = [];
        saveAllPlaylists(all);
        activePlaylistName = cleanName;
        currentViewTab = 'my_playlists';
        renderPlaylistDrawer();
      } else {
        alert("Yeh Playlist pehle se exist karti hai!");
      }
    }

    function addToSelectedPlaylist(song) {
      let all = getAllPlaylists();
      if (!all[activePlaylistName]) all[activePlaylistName] = [];
      let list = all[activePlaylistName];
      if (!list.some(s => s.id === song.id)) {
        list.push(song);
        all[activePlaylistName] = list;
        saveAllPlaylists(all);
        alert(`"${song.name || song.title}" saved to [${activePlaylistName}]!`);
      } else {
        alert(`Pehle se [${activePlaylistName}] playlist me hai!`);
      }
    }

    function removeSongFromPlaylist(songId) {
      let all = getAllPlaylists();
      if (all[activePlaylistName]) {
        all[activePlaylistName] = all[activePlaylistName].filter(s => s.id !== songId);
        saveAllPlaylists(all);
        renderPlaylistDrawer();
      }
    }

    const playlistDrawer = document.getElementById('playlistDrawer');
    const playlistToggleBtn = document.getElementById('playlistToggleBtn');

    function renderPlaylistDrawer() {
      let allPlaylists = getAllPlaylists();
      let playlistNames = Object.keys(allPlaylists);
      if (playlistNames.length === 0) {
        allPlaylists['Mood'] = [];
        playlistNames = ['Mood'];
      }
      if (!playlistNames.includes(activePlaylistName)) {
        activePlaylistName = playlistNames[0];
      }

      let dropdownOptions = playlistNames.map(name => `<option value="${name}" ${name === activePlaylistName ? 'selected' : ''}>📁 ${name}</option>`).join('');

      playlistDrawer.innerHTML = `
        <div style="display:flex; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:4px;">
          <button onclick="switchTab('search')" style="flex:1; padding:8px; background:${currentViewTab==='search'?'rgba(249,115,22,0.2)':'transparent'}; color:${currentViewTab==='search'?'#f97316':'#94a3b8'}; border:none; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:bold; cursor:pointer;">SEARCH RESULTS</button>
          <button onclick="switchTab('my_playlists')" style="flex:1; padding:8px; background:${currentViewTab==='my_playlists'?'rgba(249,115,22,0.2)':'transparent'}; color:${currentViewTab==='my_playlists'?'#f97316':'#94a3b8'}; border:none; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:bold; cursor:pointer;">MY PLAYLISTS</button>
        </div>

        ${currentViewTab === 'my_playlists' ? `
          <div style="display:flex; gap:6px; padding:6px 8px; align-items:center; background:rgba(0,0,0,0.35); border-bottom:1px solid rgba(255,255,255,0.08);">
            <select onchange="activePlaylistName=this.value; renderPlaylistDrawer();" style="flex:1; background:#0f172a; color:#f97316; border:1px solid rgba(255,255,255,0.15); border-radius:4px; padding:4px 6px; font-size:10px; font-family:'JetBrains Mono',monospace; outline:none;">
              ${dropdownOptions}
            </select>
            <button onclick="createNewPlaylist()" style="background:#f97316; color:#000; border:none; border-radius:4px; padding:4px 8px; font-size:10px; font-weight:bold; font-family:'JetBrains Mono',monospace; cursor:pointer;">+ NEW</button>
          </div>
        ` : ''}

        <div class="playlist-scroll-area" id="drawerItemsList"></div>
      `;

      let container = document.getElementById('drawerItemsList');
      let activeList = (currentViewTab === 'search') ? songsList : (allPlaylists[activePlaylistName] || []);

      if (activeList.length === 0) {
        const emptyMsg = document.createElement('div');
        emptyMsg.style.cssText = "padding:24px; text-align:center; color:#94a3b8; font-size:11px; font-family:'JetBrains Mono',monospace;";
        emptyMsg.innerHTML = currentViewTab === 'search' ? "No tracks found." : `"${activePlaylistName}" is empty.<br>Search songs and click '+ ADD'!`;
        container.appendChild(emptyMsg);
        return;
      }

      activeList.forEach((song, idx) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${idx === currentTrackIndex ? 'active-track' : ''}`;
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px; overflow:hidden; max-width:62%;">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🎵 ${song.name || song.title}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            ${currentViewTab === 'search' ? `
              <button onclick='event.stopPropagation(); addToSelectedPlaylist(${JSON.stringify(song)})' style="background:#f97316; color:#000; border:none; border-radius:4px; padding:2px 6px; font-weight:bold; font-size:10px; cursor:pointer;">+ ADD</button>
            ` : `
              <button onclick='event.stopPropagation(); removeSongFromPlaylist("${song.id}")' title="Delete Song" style="background:#ef4444; color:#fff; border:none; border-radius:4px; padding:2px 6px; font-size:10px; font-weight:bold; cursor:pointer;">✖</button>
            `}
            <span style="font-size:0.7rem; color:var(--amber-warm); font-weight:bold; cursor:pointer;">▶ PLAY</span>
          </div>
        `;
        item.addEventListener('click', () => {
          currentTrackIndex = idx;
          if (player && typeof player.loadVideoById === 'function') {
            player.loadVideoById(song.id);
          }
          updateTrackInfo(song);
          playlistDrawer.classList.remove('open');
        });
        container.appendChild(item);
      });
    }

    function switchTab(tabName) {
      currentViewTab = tabName;
      renderPlaylistDrawer();
    }

    playlistToggleBtn.addEventListener('click', () => {
      playlistDrawer.classList.toggle('open');
    });

    // --- 3. YOUTUBE HD AUDIO INITIALIZATION ---
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('yt-player', {
        height: '200',
        width: '200',
        videoId: songsList[0].id,
        host: 'https://www.youtube-nocookie.com',
        playerVars: { 
          'autoplay': 0, 
          'controls': 0, 
          'playsinline': 1, 
          'rel': 0, 
          'vq': 'hd1080'
        },
        events: {
          'onReady': (e) => {
            if (e.target.setPlaybackQuality) e.target.setPlaybackQuality('hd1080');
            renderPlaylistDrawer();
            updateTrackInfo(songsList[0]);
          },
          'onStateChange': onPlayerStateChange
        }
      });
    };

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('masterPlayBtn').innerText = '⏸';
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        document.getElementById('masterPlayBtn').innerText = '▶';
        if (event.data === YT.PlayerState.ENDED) playNextTrack();
      }
    }

    function updateTrackInfo(track) {
      const current = track || songsList[currentTrackIndex];
      if (!current) return;
      document.getElementById('currentTrackTitle').innerText = current.name || current.title || 'Studio Audio Stream';
      document.getElementById('currentTrackArtist').innerText = current.artist || 'YouTube HD Master Audio';
    }

    // Transport buttons
    const masterPlayBtn = document.getElementById('masterPlayBtn');
    masterPlayBtn.addEventListener('click', () => {
      if (!player || typeof player.getPlayerState !== 'function') return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    function playNextTrack() {
      let activeList = (currentViewTab === 'search') ? songsList : (getAllPlaylists()[activePlaylistName] || songsList);
      currentTrackIndex = (currentTrackIndex + 1) % activeList.length;
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(activeList[currentTrackIndex].id);
      }
      updateTrackInfo(activeList[currentTrackIndex]);
      renderPlaylistDrawer();
    }

    function playPrevTrack() {
      let activeList = (currentViewTab === 'search') ? songsList : (getAllPlaylists()[activePlaylistName] || songsList);
      currentTrackIndex = (currentTrackIndex - 1 + activeList.length) % activeList.length;
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(activeList[currentTrackIndex].id);
      }
      updateTrackInfo(activeList[currentTrackIndex]);
      renderPlaylistDrawer();
    }

    document.getElementById('nextTrackBtn').addEventListener('click', playNextTrack);
    document.getElementById('prevTrackBtn').addEventListener('click', playPrevTrack);

    // --- 4. LIVE AUDIO / TOPIC SEARCH ENGINE ---
    const songQueryInput = document.getElementById('songQueryInput');
    const searchSubmitBtn = document.getElementById('searchSubmitBtn');

    async function executeLiveSearch() {
      const rawQuery = songQueryInput.value.trim();
      if (!rawQuery) return;
      searchSubmitBtn.innerText = "SEARCHING...";

      try {
        const studioQuery = encodeURIComponent(`${rawQuery} "Official Audio" -trailer -teaser`);
        const res = await fetch(`https://pipedapi.kavin.rocks/search?q=${studioQuery}&filter=music_songs`);
        const data = await res.json();

        if (data && data.items && data.items.length > 0) {
          songsList = data.items.slice(0, 15).map(item => ({
            id: item.url.replace('/watch?v=', ''),
            name: item.title,
            artist: item.uploaderName || 'Official Studio Audio'
          }));
        } else {
          // Fallback fallback track
          songsList = [{ id: '1fueZCTYkpA', name: rawQuery + ' (Audio Stream)', artist: 'Studio Master' }];
        }
      } catch (err) {
        // Direct stream search fallback
        songsList = [
          { id: '1fueZCTYkpA', name: rawQuery + ' (Master Audio)', artist: 'YouTube HD Stream' },
          { id: '3v3b1Z1Kk8M', name: rawQuery + ' (Acoustic Version)', artist: 'Studio Live' }
        ];
      }

      currentViewTab = 'search';
      currentTrackIndex = 0;
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(songsList[0].id);
      }
      updateTrackInfo(songsList[0]);
      renderPlaylistDrawer();
      playlistDrawer.classList.add('open');
      searchSubmitBtn.innerText = "SEARCH";
    }

    searchSubmitBtn.addEventListener('click', executeLiveSearch);
    songQueryInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeLiveSearch();
    });

    // Initial render
    renderPlaylistDrawer();
  </script>
</body>
</html>
