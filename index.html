<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lutron Studio — Smart Control Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&family=Syncopate:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ... (CSS same rakhi hai jo aapne final ki thi, sirf motor control sync kiya hai) ... */
    :root { --bg-dark: #07090e; --bg-card: rgba(18, 22, 33, 0.92); --amber-warm: #ffaa33; --led-green: #10b981; }
    body { background: var(--bg-dark); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
    
    .curtain-panel { width: 50%; height: 100%; background: linear-gradient(180deg, #181d28, #07090e); position: absolute; top: 0; z-index: 3; transition: transform 0.3s linear; }
    .curtain-left { left: 0; }
    .curtain-right { right: 0; }

    .master-bottom-dock { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); width: 90%; max-width: 1000px; display: flex; gap: 10px; z-index: 100; }
    .glass-player { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1rem; width: 100%; }
    
    .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; cursor: pointer; margin: 10px 0; }
    .progress-bar-fill { height: 100%; background: var(--amber-warm); width: 0%; border-radius: 3px; }
    .controls { display: flex; align-items: center; gap: 15px; }
    .time-display { font-family: 'JetBrains Mono'; font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Curtain Elements -->
  <div class="curtain-container">
    <div class="curtain-panel curtain-left" id="curtainLeft"></div>
    <div class="curtain-panel curtain-right" id="curtainRight"></div>
  </div>

  <div class="master-bottom-dock">
    <div class="glass-player">
      <div id="trackInfo" style="margin-bottom:10px;">Select a Song...</div>
      <div class="progress-bar-bg" id="progressBarBg"><div class="progress-bar-fill" id="progressBarFill"></div></div>
      <div class="controls">
        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
        <button id="playPauseBtn">PLAY/PAUSE</button>
        <button id="nextBtn">NEXT</button>
      </div>
    </div>
  </div>

  <div id="yt-player"></div>

  <script>
    const YT_API_KEY = "AIzaSyCQ9yQ2a6qxbrYV-CZmVs94shF2ja_8JjQ";
    let songsList = [
      { id: "1fueZCTYkpA", name: "Tu Hi Haqeeqat" },
      { id: "sLykke8q2Is", name: "Dooriyan" }
    ];
    let currentIdx = 0;
    let player;
    let curtainPos = 0; // 0=Closed, 100=Open
    let curtainState = 'STOPPED'; // 'OPENING', 'CLOSING', 'STOPPED'
    let nextMove = 'OPEN'; // To toggle 4-step logic

    // 1. YouTube Player Logic
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '0', width: '0',
        videoId: songsList[0].id,
        events: {
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.ENDED) playNext();
          }
        }
      });
      setInterval(updateUI, 500);
    }

    function playNext() {
      currentIdx = (currentIdx + 1) % songsList.length;
      player.loadVideoById(songsList[currentIdx].id);
    }

    function updateUI() {
      if(player && player.getCurrentTime) {
        let cur = player.getCurrentTime();
        let dur = player.getDuration();
        document.getElementById('timeDisplay').innerText = formatTime(cur) + " / " + formatTime(dur);
        if(dur > 0) document.getElementById('progressBarFill').style.width = (cur/dur)*100 + "%";
      }
    }

    function formatTime(s) {
      let m = Math.floor(s/60);
      let sec = Math.floor(s%60);
      return m + ":" + (sec < 10 ? "0"+sec : sec);
    }

    // 2. Drapery Motor Logic (4-Step: Open -> Stop -> Close -> Stop)
    function handleDrapery() {
      if (curtainState !== 'STOPPED') {
        // STOP command
        curtainState = 'STOPPED';
        nextMove = (curtainPos > 50) ? 'CLOSE' : 'OPEN';
      } else {
        // START command
        curtainState = (nextMove === 'OPEN') ? 'OPENING' : 'CLOSING';
        moveCurtains();
      }
    }

    function moveCurtains() {
      if (curtainState === 'STOPPED') return;
      
      if (curtainState === 'OPENING') {
        curtainPos = Math.min(curtainPos + 1, 100);
      } else {
        curtainPos = Math.max(curtainPos - 1, 0);
      }
      
      document.getElementById('curtainLeft').style.transform = `translateX(-${curtainPos}%)`;
      document.getElementById('curtainRight').style.transform = `translateX(${curtainPos}%)`;

      if (curtainPos === 100 || curtainPos === 0) {
        curtainState = 'STOPPED';
        nextMove = (curtainPos === 100) ? 'CLOSE' : 'OPEN';
      } else {
        requestAnimationFrame(moveCurtains);
      }
    }

    // Load API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);
  </script>
</body>
</html>
