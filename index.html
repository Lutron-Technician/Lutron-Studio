<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lutron Technician — Studio & Audio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Viewport Engine */
    .viewport-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background: radial-gradient(circle at 80% 20%, #ff8c42 0%, #1e1b4b 50%, #030712 90%);
      transition: all 0.8s ease;
    }

    .viewport-bg.night {
      background: radial-gradient(circle at 80% 20%, #1e293b 0%, #090d16 60%, #020408 100%);
    }

    .viewport-bg.dali-blue {
      background: radial-gradient(circle at 50% 50%, #0284c7 0%, #0f172a 70%, #020617 100%);
    }

    .viewport-bg.ambient-warm {
      background: radial-gradient(circle at 50% 40%, #c2410c 0%, #291205 60%, #070302 100%);
    }

    .viewport-bg.all-off {
      background: #030712;
    }

    /* Fixed Warm Sun Orb */
    .sun-orb {
      position: absolute;
      top: 16%;
      right: 12%;
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, #fef08a 10%, #ea580c 80%);
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(234, 88, 12, 0.5);
      transition: opacity 0.8s ease;
    }

    .viewport-bg.all-off .sun-orb {
      opacity: 0.1;
    }

    .mountain-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 320px;
      background: linear-gradient(175deg, transparent 35%, #064e3b 35.1%, #022c22 100%);
      clip-path: polygon(0 100%, 0 65%, 25% 45%, 50% 70%, 75% 35%, 100% 60%, 100% 100%);
    }

    .viewport-bg.all-off .mountain-layer {
      opacity: 0.15;
    }

    /* Original Sleek Pendants */
    .pendant-rig {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
    }

    .pendant {
      position: absolute;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pendant.pendant-1 { right: 35%; }
    .pendant.pendant-2 { right: 12%; }

    .cord {
      width: 2px;
      height: 170px;
      background: rgba(255, 255, 255, 0.25);
    }

    .fixture-head {
      width: 28px;
      height: 14px;
      background: #0f172a;
      border-radius: 3px 3px 0 0;
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
    }

    .fixture-head::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 5px;
      background: #f97316;
      border-radius: 50%;
      box-shadow: 0 0 14px #f97316;
    }

    .light-cone {
      width: 140px;
      height: 380px;
      background: linear-gradient(180deg, rgba(249, 115, 22, 0.4) 0%, rgba(249, 115, 22, 0) 100%);
      clip-path: polygon(40% 0%, 60% 0%, 100% 100%, 0% 100%);
      filter: blur(8px);
      transition: opacity 0.8s ease;
    }

    .viewport-bg.all-off ~ .pendant-rig .light-cone {
      opacity: 0;
    }

    /* Drapery System */
    .drapery-track {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      pointer-events: none;
      z-index: 3;
      transition: opacity 0.8s ease;
    }

    .curtain {
      width: 50vw;
      height: 100vh;
      background: repeating-linear-gradient(90deg, #18181b, #27272a 30px, #09090b 60px);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .curtain.left { transform: translateX(-100%); }
    .curtain.right { transform: translateX(100%); }

    .curtains-closed .curtain.left { transform: translateX(0); }
    .curtains-closed .curtain.right { transform: translateX(0); }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 20px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .branding-box h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #f8fafc;
      text-transform: uppercase;
    }

    .branding-box p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: #f97316;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94a3b8;
    }

    /* Keypad & Main */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1300px;
      padding: 0 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-grow: 1;
    }

    .keypad-chassis {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .keypad-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .keypad-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .keypad-btn.active {
      background: rgba(249, 115, 22, 0.12);
      border-color: #f97316;
      color: #fff;
    }

    .led-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #334155;
    }

    .keypad-btn.active .led-dot {
      background: #f97316;
      box-shadow: 0 0 8px #f97316;
    }

    /* Playlist Drawer */
    .playlist-drawer {
      position: absolute;
      right: 36px;
      bottom: 110px;
      width: 360px;
      max-height: 420px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.3s ease;
      opacity: 0;
      pointer-events: none;
      transform: translateY(15px);
    }

    .playlist-drawer.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .drawer-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .drawer-tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .drawer-tab-btn.active {
      color: #f97316;
      border-bottom: 2px solid #f97316;
    }

    .playlist-items-container {
      overflow-y: auto;
      max-height: 350px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #cbd5e1;
      cursor: pointer;
    }

    .song-row:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .song-row.active {
      border: 1px solid #f97316;
      color: #f97316;
    }

    .song-row-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .add-fav-btn {
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 4px;
      color: #f97316;
      padding: 3px 6px;
      font-size: 10px;
      cursor: pointer;
    }

    .add-fav-btn:hover {
      background: #f97316;
      color: #000;
    }

    /* Player Console Footer */
    footer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
      padding: 0 20px;
    }

    .player-deck {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 14px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      outline: none;
    }

    .search-input:focus {
      border-color: #f97316;
    }

    .search-btn, .toggle-drawer-btn {
      background: #f97316;
      color: #0b0f19;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      cursor: pointer;
    }

    .toggle-drawer-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 300px;
    }

    .track-art {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: #1e293b;
      object-fit: cover;
    }

    .track-text h4 {
      font-size: 12px;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
    }

    .track-text p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: #f97316;
      margin-top: 2px;
    }

    .deck-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .circle-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 13px;
    }

    .circle-btn.play-pause {
      background: #f97316;
      color: #0b0f19;
      width: 40px;
      height: 40px;
      font-size: 16px;
      border: none;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #f97316;
      border-radius: 2px;
    }

    .time-indicators {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: #64748b;
      margin-top: -6px;
    }

    #yt-hidden-engine {
      position: absolute;
      top: -9999px;
      left: -9999px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Viewport Background -->
  <div class="viewport-bg" id="ambientBg">
    <div class="sun-orb"></div>
    <div class="mountain-layer"></div>
  </div>

  <!-- Original Pendants -->
  <div class="pendant-rig">
    <div class="pendant pendant-1">
      <div class="cord"></div>
      <div class="fixture-head"></div>
      <div class="light-cone"></div>
    </div>
    <div class="pendant pendant-2">
      <div class="cord"></div>
      <div class="fixture-head"></div>
      <div class="light-cone"></div>
    </div>
  </div>

  <!-- Drapery Tracks -->
  <div class="drapery-track" id="draperyTrack">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="branding-box">
      <h1>Lutron Technician</h1>
      <p>SYSTEM PROGRAMMER • ARCHITECTURAL LIGHTING & MOTORIZED DRAPERY</p>
    </div>
    <div class="status-badge" id="draperyLabel">
      ● SCENE: 01 BRIGHT (STAGE VIEW)
    </div>
  </header>

  <!-- Keypad & Playlist -->
  <main>
    <div class="keypad-chassis">
      <button class="keypad-btn active" data-scene="bright">
        <span>01 BRIGHT</span>
        <div class="led-dot"></div>
      </button>
      <button class="keypad-btn" data-scene="dim">
        <span>02 DIM / MOVIE</span>
        <div class="led-dot"></div>
      </button>
      <button class="keypad-btn" data-scene="warm">
        <span>03 AMBIENT 2700K</span>
        <div class="led-dot"></div>
      </button>
      <button class="keypad-btn" data-scene="dali">
        <span>04 DALI BLUE</span>
        <div class="led-dot"></div>
      </button>
      <button class="keypad-btn" data-scene="drapery">
        <span id="draperyBtnText">05 DRAPERY: OPEN</span>
        <div class="led-dot"></div>
      </button>
      <button class="keypad-btn" data-scene="off">
        <span>06 ALL OFF</span>
        <div class="led-dot"></div>
      </button>
    </div>

    <div class="playlist-drawer" id="playlistDrawer">
      <div class="drawer-tabs">
        <button class="drawer-tab-btn active" id="tabSearchBtn" onclick="switchDrawerTab('search')">SEARCH RESULTS</button>
        <button class="drawer-tab-btn" id="tabFavsBtn" onclick="switchDrawerTab('favs')">MY PLAYLIST</button>
      </div>

      <div class="playlist-items-container" id="playlistItemsList">
        <!-- Rendered items -->
      </div>
    </div>
  </main>

  <!-- Player Console -->
  <footer>
    <div class="player-deck">
      <div class="search-row">
        <input type="text" class="search-input" id="songQueryInput" placeholder="Search track or artist (e.g. Arijit Singh, Awarapan, Atif)..." />
        <button class="search-btn" id="searchSubmitBtn">SEARCH</button>
        <button class="toggle-drawer-btn" id="drawerToggleBtn">SONGS</button>
      </div>

      <div class="control-row">
        <div class="track-meta">
          <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop&q=80" alt="Cover" class="track-art" id="playerThumb" />
          <div class="track-text">
            <h4 id="playerTrackTitle">Toh Phir Aao — Lounge Master</h4>
            <p id="playerSubtitle">STUDIO MASTER • 256 KBPS HD</p>
          </div>
        </div>

        <div class="deck-buttons">
          <button class="circle-btn" id="prevBtn">⏮</button>
          <button class="circle-btn play-pause" id="playPauseBtn">▶</button>
          <button class="circle-btn" id="nextBtn">⏭</button>
        </div>
      </div>

      <div class="progress-bar-wrap" id="progressBarBg">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="time-indicators">
        <span id="currentTimeLabel">0:00</span>
        <span id="totalDurationLabel">0:00</span>
      </div>
    </div>
  </footer>

  <div id="yt-hidden-engine"></div>

  <script src="https://www.youtube-nocookie.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;
    let currentTrackIndex = 0;
    let currentTab = 'search'; 

    let songsList = [
      { id: "cmMiyZaSELo", name: "Toh Phir Aao — Lounge Master", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=150" },
      { id: "f6ZbgoxzQ50", name: "Tera Mera Rishta — Acoustic Session", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" }
    ];

    function getPersonalFavorites() {
      const data = localStorage.getItem('lutron_my_playlist');
      return data ? JSON.parse(data) : [];
    }

    function savePersonalFavorites(arr) {
      localStorage.setItem('lutron_my_playlist', JSON.stringify(arr));
    }

    // Keypad Logic
    const ambientBg = document.getElementById('ambientBg');
    const draperyTrack = document.getElementById('draperyTrack');
    const draperyLabel = document.getElementById('draperyLabel');
    const draperyBtnText = document.getElementById('draperyBtnText');
    const keypadBtns = document.querySelectorAll('.keypad-btn');
    let draperyClosed = false;

    keypadBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const scene = btn.getAttribute('data-scene');

        if (scene === 'drapery') {
          draperyClosed = !draperyClosed;
          draperyTrack.classList.toggle('curtains-closed', draperyClosed);
          draperyBtnText.textContent = draperyClosed ? "05 DRAPERY: CLOSED" : "05 DRAPERY: OPEN";
          draperyLabel.textContent = draperyClosed ? "● SCENE: DRAPERY CLOSED (PRIVACY)" : "● SCENE: DRAPERY OPEN";
          btn.classList.toggle('active', draperyClosed);
          return;
        }

        keypadBtns.forEach(b => {
          if (b.getAttribute('data-scene') !== 'drapery') b.classList.remove('active');
        });
        btn.classList.add('active');

        ambientBg.className = 'viewport-bg';
        if (scene === 'bright') draperyLabel.textContent = "● SCENE: 01 BRIGHT (STAGE VIEW)";
        if (scene === 'dim') { ambientBg.classList.add('night'); draperyLabel.textContent = "● SCENE: 02 MOVIE DIM"; }
        if (scene === 'warm') { ambientBg.classList.add('ambient-warm'); draperyLabel.textContent = "● SCENE: 03 AMBIENT 2700K"; }
        if (scene === 'dali') { ambientBg.classList.add('dali-blue'); draperyLabel.textContent = "● SCENE: 04 DALI BLUE"; }
        if (scene === 'off') { ambientBg.classList.add('all-off'); draperyLabel.textContent = "● SCENE: 06 ALL OFF"; }
      });
    });

    // YouTube API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-hidden-engine', {
        height: '0',
        width: '0',
        videoId: songsList[0].id,
        host: 'https://www.youtube-nocookie.com',
        playerVars: { 
          'autoplay': 0, 
          'controls': 0, 
          'playsinline': 1,
          'rel': 0,
          'modestbranding': 1,
          'vq': 'hd1080'
        },
        events: {
          'onReady': (e) => {
            if (e.target.setPlaybackQuality) e.target.setPlaybackQuality('hd1080');
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('playPauseBtn').textContent = '⏸';
        if (player.setPlaybackQuality) player.setPlaybackQuality('hd1080');
      } else if (event.data === YT.PlayerState.ENDED) {
        playNextTrack();
      } else {
        isPlaying = false;
        document.getElementById('playPauseBtn').textContent = '▶';
      }
    }

    function playTrackAtIndex(idx) {
      const list = (currentTab === 'search') ? songsList : getPersonalFavorites();
      if (!list || !list[idx]) return;

      currentTrackIndex = idx;
      const track = list[idx];

      document.getElementById('playerTrackTitle').textContent = track.name;
      document.getElementById('playerThumb').src = track.img || "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100";
      
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById({
          videoId: track.id,
          suggestedQuality: 'hd1080'
        });
        player.playVideo();
      }
      renderPlaylistDrawer();
    }

    function playNextTrack() {
      const list = (currentTab === 'search') ? songsList : getPersonalFavorites();
      if (list.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % list.length;
      playTrackAtIndex(currentTrackIndex);
    }

    function switchDrawerTab(tab) {
      currentTab = tab;
      document.getElementById('tabSearchBtn').classList.toggle('active', tab === 'search');
      document.getElementById('tabFavsBtn').classList.toggle('active', tab === 'favs');
      renderPlaylistDrawer();
    }

    function addSongToMyFavorites(song) {
      const favs = getPersonalFavorites();
      if (!favs.some(s => s.id === song.id)) {
        favs.push(song);
        savePersonalFavorites(favs);
        alert(`"${song.name}" added to My Playlist!`);
      } else {
        alert("Already in My Playlist!");
      }
    }

    function renderPlaylistDrawer() {
      const container = document.getElementById('playlistItemsList');
      container.innerHTML = '';

      const list = (currentTab === 'search') ? songsList : getPersonalFavorites();

      if (list.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: #64748b; padding: 20px; font-size: 11px; font-family: 'JetBrains Mono';">Playlist is empty.<br>Search songs and click "+ ADD"!</div>`;
        return;
      }

      list.forEach((song, idx) => {
        const row = document.createElement('div');
        row.className = `song-row ${idx === currentTrackIndex ? 'active' : ''}`;
        row.innerHTML = `
          <span class="song-row-title" onclick="playTrackAtIndex(${idx})">🎵 ${song.name}</span>
          ${currentTab === 'search' ? `<button class="add-fav-btn" onclick='event.stopPropagation(); addSongToMyFavorites(${JSON.stringify(song)})'>+ ADD</button>` : `<span style="font-size: 10px; color: #f97316;" onclick="playTrackAtIndex(${idx})">▶ PLAY</span>`}
        `;
        container.appendChild(row);
      });
    }

    // 100% Guaranteed Song Search Engine (Direct Global Music Database)
    const songQueryInput = document.getElementById('songQueryInput');
    const searchSubmitBtn = document.getElementById('searchSubmitBtn');

    window.searchJSONPCallback = function(data) {
      if (data && data.results && data.results.length > 0) {
        songsList = data.results.map(item => {
          const cleanName = `${item.trackName || item.collectionName} — ${item.artistName}`;
          return {
            id: "", // Resolved dynamically on click
            queryKey: `${item.trackName || ''} ${item.artistName || ''} official audio`,
            name: cleanName,
            img: item.artworkUrl100 ? item.artworkUrl100.replace('100x100', '300x300') : "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=150"
          };
        });

        // Resolve top track & open
        switchDrawerTab('search');
        document.getElementById('playlistDrawer').classList.add('open');
        resolveAndPlay(0);
      } else {
        alert("No results found! Try another song or artist name.");
      }
      searchSubmitBtn.textContent = "SEARCH";
    };

    function resolveAndPlay(idx) {
      currentTrackIndex = idx;
      const song = (currentTab === 'search') ? songsList[idx] : getPersonalFavorites()[idx];
      if (!song) return;

      document.getElementById('playerTrackTitle').textContent = song.name;
      document.getElementById('playerThumb').src = song.img || "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100";

      if (song.id) {
        if (player && typeof player.loadVideoById === 'function') {
          player.loadVideoById({ videoId: song.id, suggestedQuality: 'hd1080' });
          player.playVideo();
        }
      } else {
        // Fallback fast direct stream query
        const safeQuery = song.queryKey || song.name;
        const script = document.createElement('script');
        script.src = `https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q=${encodeURIComponent(safeQuery)}&callback=ytSuggestCallback`;
        document.body.appendChild(script);

        // Preload video directly
        if (player && typeof player.loadPlaylist === 'function') {
          player.loadPlaylist({
            listType: 'search',
            list: safeQuery,
            suggestedQuality: 'hd1080'
          });
        }
      }
      renderPlaylistDrawer();
    }

    window.ytSuggestCallback = function() {};

    function executeLiveStudioSearch() {
      const rawQuery = songQueryInput.value.trim();
      if (!rawQuery) return;

      searchSubmitBtn.textContent = "SEARCHING...";

      const oldScript = document.getElementById('jsonp-search-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-search-script';
      script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(rawQuery)}&entity=song&limit=15&callback=searchJSONPCallback`;
      document.body.appendChild(script);
    }

    searchSubmitBtn.addEventListener('click', executeLiveStudioSearch);
    songQueryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeLiveStudioSearch();
    });

    // Control Listeners
    document.getElementById('playPauseBtn').addEventListener('click', () => {
      if (!player) return;
      if (isPlaying) { player.pauseVideo(); } else { player.playVideo(); }
    });

    document.getElementById('nextBtn').addEventListener('click', playNextTrack);
    document.getElementById('prevBtn').addEventListener('click', () => {
      const list = (currentTab === 'search') ? songsList : getPersonalFavorites();
      if (list.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + list.length) % list.length;
      playTrackAtIndex(currentTrackIndex);
    });

    document.getElementById('drawerToggleBtn').addEventListener('click', () => {
      document.getElementById('playlistDrawer').classList.toggle('open');
    });

    // Progress Bar
    setInterval(() => {
      if (player && typeof player.getCurrentTime === 'function' && isPlaying) {
        const cur = player.getCurrentTime();
        const dur = player.getDuration();
        if (dur > 0) {
          document.getElementById('progressFill').style.width = `${(cur / dur) * 100}%`;
          document.getElementById('currentTimeLabel').textContent = formatSeconds(cur);
          document.getElementById('totalDurationLabel').textContent = formatSeconds(dur);
        }
      }
    }, 500);

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    document.getElementById('progressBarBg').addEventListener('click', (e) => {
      if (player && typeof player.getDuration === 'function') {
        const rect = e.currentTarget.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        player.seekTo(pos * player.getDuration(), true);
      }
    });

    renderPlaylistDrawer();
  </script>
</body>
</html>
