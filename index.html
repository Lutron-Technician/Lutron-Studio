<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lutron Technician — Master Control Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syncopate:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(18, 22, 33, 0.92);
      --amber-warm: #ffaa33;
      --qs-blue: #00d2ff;
      --led-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #8a94a6;
      --border-light: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --fixture-color: #ffaa00;
      --fixture-glow: rgba(255, 170, 0, 0.65);
      --beam-opacity: 0.85;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: var(--bg-dark); }

    /* OUTDOOR WEATHER SCENERY */
    .outdoor-scenery { position: absolute; inset: 0; z-index: 1; transition: background 2s ease; }
    .day-mode { background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%); }
    .night-mode { background: radial-gradient(circle at 78% 22%, #090d16 0%, #020617 100%); }
    
    .sky-sun { position: absolute; top: 12%; right: 28%; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #ffffff 20%, #fef08a 60%, #eab308 100%); opacity: 0.35; }
    .mountain-layer { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; pointer-events: none; z-index: 3; }
    .mountain-back { fill: #1e3a8a; opacity: 0.2; }
    .mountain-front { fill: #0f172a; opacity: 0.6; }

    /* CURTAINS & GRID */
    .curtain-track-rod { position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: linear-gradient(180deg, #374151, #111827); z-index: 5; }
    .blueprint-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 210, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 210, 255, 0.02) 1px, transparent 1px); background-size: 35px 35px; pointer-events: none; z-index: 5; }
    
    .ambient-glow { position: absolute; top: 40%; right: 10vw; transform: translate(30%, -20%); width: 650px; height: 650px; background: radial-gradient(circle, var(--fixture-glow) 0%, transparent 70%); border-radius: 50%; filter: blur(100px); z-index: 6; pointer-events: none; opacity: var(--beam-opacity); }

    /* LIGHTING FIXTURES */
    .lighting-fixtures-layer { position: absolute; top: 0; right: 8vw; z-index: 7; pointer-events: none; display: flex; gap: 6vw; }
    .pendant-1 .pendant-wire { width: 2px; height: 110px; background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.4)); }
    .pendant-2 .pendant-wire { width: 2px; height: 175px; background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.4)); }
    .pendant-shade { width: 52px; height: 28px; background: linear-gradient(180deg, #2a2f3a 0%, #11141a 100%); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px 6px 2px 2px; }
    .pendant-bulb { width: 22px; height: 22px; border-radius: 50%; background-color: var(--fixture-color); box-shadow: 0 0 25px var(--fixture-color); margin-top: -6px; }
    .light-beam { width: 220px; height: 580px; background: linear-gradient(180deg, var(--fixture-glow) 0%, transparent 100%); clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%); filter: blur(12px); opacity: var(--beam-opacity); }

    .app-container { position: relative; z-index: 10; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 1.8rem 4vw 9.5rem 4vw; pointer-events: none; }
    .app-container > * { pointer-events: auto; }

    /* SCENES & PLAYER UI (Cleaned) */
    .palladiom-frame { width: 260px; height: auto; background: linear-gradient(145deg, #2a2f3d, #12151f); border-radius: 12px; padding: 12px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9); }
    .keypad-btn { height: 42px; width: 100%; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05); color: #fff; border-radius: 4px; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .keypad-btn.active { background: rgba(255, 170, 51, 0.2); border-color: var(--amber-warm); }
    
    .kelvin-inline-tumbler { max-height: 0; overflow: hidden; transition: 0.3s; background: rgba(0,0,0,0.3); padding: 0 10px; }
    .kelvin-inline-tumbler.open { max-height: 100px; padding: 10px; }
    .horizontal-slider { width: 100%; accent-color: var(--amber-warm); cursor: pointer; }

    .glass-player { background: var(--bg-card); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 18px; padding: 1rem; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .player-wrapper { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); width: calc(100% - 2rem); max-width: 870px; z-index: 100; }
  </style>
</head>
<body>

  <div class="outdoor-scenery day-mode" id="outdoorScenery">
    <div class="sky-sun"></div>
    <svg class="mountain-layer" viewBox="0 0 1440 600" preserveAspectRatio="none">
      <path class="mountain-back" d="M0,600 L0,320 L160,220 L340,360 L520,180 L720,310 L940,150 L1160,290 L1320,190 L1440,260 L1440,600 Z"></path>
      <path class="mountain-front" d="M0,600 L0,410 L220,290 L460,430 L680,260 L920,410 L1180,240 L1360,370 L1440,310 L1440,600 Z"></path>
    </svg>
  </div>
  
  <div class="blueprint-grid"></div>
  <div class="ambient-glow" id="ambientGlow"></div>

  <div class="lighting-fixtures-layer">
    <div class="pendant-light pendant-1"><div class="pendant-wire"></div><div class="pendant-shade"></div><div class="pendant-bulb"></div><div class="light-beam"></div></div>
    <div class="pendant-light pendant-2"><div class="pendant-wire"></div><div class="pendant-shade"></div><div class="pendant-bulb"></div><div class="light-beam"></div></div>
  </div>

  <div class="app-container">
    <header class="top-header">
      <div class="status-badge"><span class="led-dot"></span><span id="processorStatusText">SYSTEM ACTIVE</span></div>
      <div id="liveWeatherStatus" style="font-family:'JetBrains Mono',monospace; color:var(--amber-warm);">LOADING WEATHER...</div>
    </header>

    <main class="central-stage">
      <div class="sidebar-drawer" id="sidebarDrawer">
        <div class="palladiom-frame">
          <button class="keypad-btn" data-scene="bright">BRIGHT</button>
          <button class="keypad-btn active" data-scene="warm">AMBIENT 2700K</button>
          <div class="kelvin-inline-tumbler" id="kelvinTumbler">
            <input type="range" min="1000" max="12000" value="3000" class="horizontal-slider" id="kelvinRange">
            <input type="range" min="0" max="100" value="85" class="horizontal-slider" id="dimRange">
          </div>
          <button class="keypad-btn" data-scene="off">ALL OFF</button>
        </div>
      </div>
    </main>
  </div>

  <div class="player-wrapper">
    <div class="glass-player">
      <div id="stream-container" style="width:100%; height:auto;"></div>
      <input type="text" id="songQueryInput" placeholder="Search Song..." style="width:100%; padding:10px; background:rgba(255,255,255,0.1); color:#fff; border:none; border-radius:8px;">
      <button id="searchSubmitBtn" style="width:100%; margin-top:5px; background:var(--amber-warm); border:none; padding:8px; cursor:pointer;">PLAY STREAM</button>
    </div>
  </div>

  <script>
    const warmBtn = document.querySelector('[data-scene="warm"]');
    const tumbler = document.getElementById('kelvinTumbler');
    warmBtn.addEventListener('click', () => { tumbler.classList.toggle('open'); });

    // Weather Sync
    async function updateWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=18.62&longitude=73.80&current_weather=true");
        const data = await res.json();
        document.getElementById('liveWeatherStatus').innerText = `TEMP: ${data.current_weather.temperature}°C`;
      } catch(e) { document.getElementById('liveWeatherStatus').innerText = "WEATHER: ONLINE"; }
    }
    updateWeather();

    // Stream Bridge
    document.getElementById('searchSubmitBtn').addEventListener('click', async () => {
      const q = document.getElementById('songQueryInput').value;
      // Invidious API Proxy to bypass YouTube bot blocks
      const searchRes = await fetch(`https://yeti.peace-of-mind.site/api/v1/search?q=${encodeURIComponent(q)}`);
      const data = await searchRes.json();
      if(data[0]) {
        document.getElementById('stream-container').innerHTML = `<iframe src="https://yeti.peace-of-mind.site/embed/${data[0].videoId}?autoplay=1" width="100%" height="200" allowfullscreen></iframe>`;
      }
    });

    // Lighting logic
    const root = document.documentElement;
    document.getElementById('kelvinRange').addEventListener('input', (e) => {
      const k = e.target.value;
      const color = k < 5000 ? "#ffaa00" : "#ffffff";
      root.style.setProperty('--fixture-color', color);
    });
    document.getElementById('dimRange').addEventListener('input', (e) => {
      root.style.setProperty('--beam-opacity', e.target.value / 100);
    });
  </script>
</body>
</html>
