  <style>
/* Player and Drawer Screen Lock */
.player-deck-container, footer, .player-bar, #playerDeck, .player-deck {
  position: fixed !important;
  bottom: 20px !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  z-index: 9999 !important;
  width: 90% !important;
  max-width: 880px !important;
}

#playlistDrawer {
  position: fixed !important;
  bottom: 105px !important;
  right: 5% !important;
  z-index: 10000 !important;
}
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(18, 22, 33, 0.92);
      --amber-warm: #ffaa33;
      --qs-blue: #00d2ff;
      --led-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #8a94a6;
      --border-light: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);

      --fixture-color: #ff8800;
      --fixture-glow: rgba(255, 136, 0, 0.75);
      --beam-opacity: 0.85;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark); color: var(--text-main); position: relative;
    }

    /* OUTDOOR SCENERY */
    .outdoor-scenery {
      position: absolute; inset: 0; z-index: 1; overflow: hidden;
      transition: background 2s ease-in-out;
    }

    .outdoor-scenery.day-mode {
      background: linear-gradient(180deg, #2b7fff 0%, #70b5ff 40%, #ffd166 80%, #f77f00 100%);
    }

    .outdoor-scenery.night-mode {
      background: radial-gradient(circle at 78% 22%, #1a2a47 0%, #0c1222 45%, #04060d 100%);
    }

    .sky-sun {
      position: absolute; top: 12%; right: 18%; width: 125px; height: 125px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 15%, #ffe66d 45%, #ff9f1c 75%, rgba(255, 159, 28, 0) 100%);
      box-shadow: 0 0 90px #ff9f1c, 0 0 180px rgba(255, 159, 28, 0.6);
      opacity: 0; transform: translateY(40px) scale(0.8);
      transition: all 2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .outdoor-scenery.day-mode .sky-sun { opacity: 1; transform: translateY(0) scale(1); }

    .sky-moon {
      position: absolute; top: 10%; right: 16%; width: 85px; height: 85px;
      border-radius: 50%;
      box-shadow: -15px 10px 0 0 #f4f1de, 0 0 40px rgba(244, 241, 222, 0.45);
      opacity: 0; transform: translateY(40px) scale(0.8) rotate(-15deg);
      transition: all 2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .outdoor-scenery.night-mode .sky-moon { opacity: 1; transform: translateY(0) scale(1) rotate(-15deg); }

    .sky-stars {
      position: absolute; inset: 0;
      background-image: 
        radial-gradient(1.5px 1.5px at 35px 50px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 110px 170px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 190px 80px, #e0e1dd, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 300px 210px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 450px 120px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 610px 250px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 770px 70px, #e0e1dd, rgba(0,0,0,0));
      background-size: 850px 450px;
      opacity: 0; transition: opacity 2s ease;
    }
    .outdoor-scenery.night-mode .sky-stars { opacity: 0.85; }

    .mountain-layer {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
      pointer-events: none;
    }

    .mountain-back {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
      fill: #0c1524; transition: fill 2s ease;
    }
    .outdoor-scenery.day-mode .mountain-back { fill: #588157; opacity: 0.75; }
    .outdoor-scenery.night-mode .mountain-back { fill: #0b1320; }

    .mountain-front {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 75%;
      fill: #050a12; transition: fill 2s ease;
    }
    .outdoor-scenery.day-mode .mountain-front { fill: #344e41; }
    .outdoor-scenery.night-mode .mountain-front { fill: #04070d; }

    /* MOTORIZED CURTAINS */
    .curtain-container {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      display: flex; width: 100%; height: 100%;
    }

    .curtain-panel {
      flex: 1; height: 100%;
      background: linear-gradient(180deg, #181d28 0%, #0e121a 50%, #07090e 100%);
      position: relative;
      transition: transform 2.4s cubic-bezier(0.65, 0, 0.35, 1);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.85);
    }

    .curtain-pleats {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.04) 0px,
        rgba(0, 0, 0, 0.5) 20px,
        rgba(255, 255, 255, 0.07) 40px,
        rgba(0, 0, 0, 0.65) 60px
      );
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }

    .curtain-left {
      border-right: 2px solid rgba(255,255,255,0.06);
      transform-origin: left center;
      transform: translateX(0%);
    }

    .curtain-right {
      border-left: 2px solid rgba(255,255,255,0.06);
      transform-origin: right center;
      transform: translateX(0%);
    }

    .curtain-container.curtain-open .curtain-left {
      transform: translateX(-92%) scaleX(0.25);
    }
    .curtain-container.curtain-open .curtain-right {
      transform: translateX(92%) scaleX(0.25);
    }

    .curtain-track-rod {
      position: absolute; top: 0; left: 0; width: 100%; height: 8px;
      background: linear-gradient(180deg, #374151, #111827);
      box-shadow: 0 4px 10px rgba(0,0,0,0.9); z-index: 4;
    }

    .blueprint-grid { 
      position: absolute; inset: 0; 
      background-image: linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px); 
      background-size: 35px 35px; pointer-events: none; z-index: 4; 
    }
    
    /* PENDANT FIXTURES */
    .lighting-fixtures-layer {
      position: absolute; top: 0; right: 12vw; z-index: 6; pointer-events: none;
      display: flex; gap: 9vw;
    }

    .pendant-light {
      display: flex; flex-direction: column; align-items: center; position: relative;
    }

    .pendant-wire {
      width: 2px; height: 130px;
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.45));
    }

    .pendant-shade {
      width: 48px; height: 26px;
      background: linear-gradient(180deg, #2a2f3a 0%, #11141a 100%);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px 6px 2px 2px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.85);
    }

    .pendant-bulb {
      width: 22px; height: 22px; border-radius: 50%;
      background-color: var(--fixture-color);
      box-shadow: 0 0 25px var(--fixture-color), 0 0 50px var(--fixture-color);
      margin-top: -6px;
      transition: background-color 0.8s ease, box-shadow 0.8s ease;
    }

    .light-beam {
      width: 180px; height: 480px;
      background: linear-gradient(180deg, var(--fixture-glow) 0%, transparent 100%);
      clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
      opacity: var(--beam-opacity); filter: blur(7px);
      transition: all 0.8s ease;
    }

    .ambient-glow {
      position: absolute; top: 40%; right: 12%; transform: translate(30%, -30%);
      width: 850px; height: 850px;
      background: radial-gradient(circle, var(--fixture-glow) 0%, transparent 65%);
      border-radius: 50%; filter: blur(95px);
      transition: all 0.8s ease-in-out; z-index: 5; pointer-events: none; opacity: var(--beam-opacity);
    }

    .app-container {
      position: relative; z-index: 10; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 1.5rem 4vw 9.5rem 4vw;
    }

    .top-header {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted);
    }

    .status-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(255, 255, 255, 0.03); padding: 0.4rem 0.8rem; border-radius: 100px; border: 1px solid var(--border-light);
    }

    .led-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--led-green); box-shadow: 0 0 8px var(--led-green); }

    .hero-header { text-align: left; margin-top: 0.5rem; margin-bottom: 0.8rem; }
    .main-title {
      font-family: 'Syncopate', sans-serif; font-size: clamp(2rem, 4.5vw, 3.6rem); font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.15em;
      background: linear-gradient(180deg, #ffffff 0%, #a0aab8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub-title { font-family: 'JetBrains Mono', monospace; font-size: clamp(0.7rem, 1.5vw, 0.85rem); color: var(--amber-warm); letter-spacing: 0.25em; text-transform: uppercase; margin-top: 0.25rem; }

    .central-stage {
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
      position: relative; flex-grow: 1; width: 100%;
    }

    .palladiom-frame {
      width: 260px; height: 390px;
      background: linear-gradient(145deg, #2a2f3d, #12151f);
      border-radius: 12px; padding: 12px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
      position: relative; border: 1px solid rgba(255, 255, 255, 0.08); cursor: pointer;
    }

    .palladiom-faceplate {
      width: 100%; height: 100%; background: linear-gradient(135deg, #1d222e 0%, #11141c 100%);
      border-radius: 6px; display: flex; flex-direction: column; gap: 8px; padding: 10px;
    }

    .keypad-btn {
      flex: 1; background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 4px;
      display: flex; justify-content: space-between; align-items: center; padding: 0 14px;
      color: rgba(255, 255, 255, 0.65); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; cursor: pointer;
      transition: all 0.3s ease;
    }

    .keypad-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .keypad-btn.active {
      color: #ffffff; background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.3);
    }

    .keypad-led { width: 5px; height: 5px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.2); }
    .keypad-btn.active .keypad-led { background-color: var(--amber-warm); box-shadow: 0 0 10px var(--amber-warm); }

    /* PLAYER CONTROLS */
    .player-wrapper { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); width: calc(100% - 2rem); max-width: 850px; z-index: 100; }
    .glass-player { background: var(--bg-card); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 18px; padding: 0.8rem 1.2rem; display: flex; flex-direction: column; gap: 0.6rem; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.85); }

    .search-box-row { display: flex; gap: 8px; width: 100%; }
    .song-search-input {
      flex: 1; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-light);
      border-radius: 10px; padding: 0.6rem 1rem; color: #fff; font-size: 0.82rem;
      font-family: 'Inter', sans-serif; outline: none; transition: all 0.3s ease;
    }
    .song-search-input:focus { border-color: var(--amber-warm); background: rgba(255, 255, 255, 0.14); }
    .search-submit-btn {
      background: var(--amber-warm); color: #000; border: none; border-radius: 10px;
      padding: 0 1.3rem; font-weight: 700; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      cursor: pointer; transition: all 0.2s ease;
    }

    .player-top-row { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; }
    .track-info { display: flex; align-items: center; gap: 0.8rem; flex: 1; min-width: 0; }
    .album-art { width: 44px; height: 44px; border-radius: 10px; background: #2a3042; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border-light); }
    .album-art img { width: 100%; height: 100%; object-fit: cover; }
    
    .track-details { display: flex; flex-direction: column; min-width: 0; }
    .track-title { font-size: 0.86rem; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 0.7rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player-controls { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .ctrl-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-light); color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.15); }
    .ctrl-btn.play-btn { width: 42px; height: 42px; background: var(--amber-warm); color: var(--bg-dark); border: none; }
    .ctrl-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .playlist-toggle-btn { background: rgba(255, 170, 51, 0.15); border: 1px solid var(--amber-warm); color: var(--amber-warm); border-radius: 8px; padding: 0.45rem 0.8rem; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 600; }

    .playlist-drawer {
      position: absolute; bottom: 100%; right: 0; width: 380px; max-height: 300px; overflow-y: auto;
      background: rgba(12, 15, 23, 0.98); backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border); border-radius: 14px; margin-bottom: 10px;
      display: none; flex-direction: column; padding: 10px; gap: 6px; box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      z-index: 120;
    }
    .playlist-drawer.open { display: flex; }
    .playlist-item { padding: 9px 12px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid transparent; font-size: 0.78rem; cursor: pointer; transition: all 0.2s ease; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
    .playlist-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); }
    .playlist-item.active-track { background: rgba(255, 170, 51, 0.18); border-color: var(--amber-warm); color: var(--amber-warm); font-weight: 600; }

    .progress-container { display: flex; align-items: center; gap: 0.6rem; width: 100%; }
    .time-stamp { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text-muted); min-width: 30px; }
    .progress-bar-bg { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; cursor: pointer; }
    .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--amber-warm), var(--qs-blue)); border-radius: 10px; }

    #youtube-player-container {
      position: fixed; bottom: -500px; left: -500px; width: 200px; height: 200px; opacity: 0.01; pointer-events: none;
    }

    @media (max-width: 768px) {
      .app-container { padding: 1.5rem 1.5rem 9.5rem 1.5rem; }
      .hero-header { text-align: center; }
      .central-stage { align-items: center; }
      .lighting-fixtures-layer { right: 5vw; gap: 12vw; }
      .playlist-drawer { width: 100%; right: 0; }
    }
  </style>
</head>

      { id: "sLykke8q2Is", name: "Dooriyan — Dino James ft. Kaprila", img: "https://i.ytimg.com/vi/sLykke8q2Is/hqdefault.jpg" },

      { id: "o1-f2rB_gP4", name: "Abhi Mujh Mein Kahin — Sonu Nigam", img: "https://i.ytimg.com/vi/o1-f2rB_gP4/hqdefault.jpg" }

    function updateAtmosphereView() {
      const hour = new Date().getHours();
      const isDayTime = (hour >= 6 && hour < 18);

      outdoorScenery.className = isDayTime ? 'outdoor-scenery day-mode' : 'outdoor-scenery night-mode';

      if (isCurtainOpen) {
        curtainContainer.classList.add('curtain-open');
        shadesBtn.querySelector('span').textContent = "05 DRAPERY: OPEN";
        document.getElementById('processorStatusText').textContent = isDayTime ? 
          "SCENE: DRAPERY OPEN (DAYLIGHT VIEW)" : 
          "SCENE: DRAPERY OPEN (NIGHT MOON VIEW)";
      } else {
        curtainContainer.classList.remove('curtain-open');
        shadesBtn.querySelector('span').textContent = "05 DRAPERY: CLOSED";
        document.getElementById('processorStatusText').textContent = "SCENE: DRAPERY CLOSED (ROOM PRIVACY)";
      }
    }

    const keypadButtons = document.querySelectorAll('.keypad-btn');
    const root = document.documentElement;

    const sceneLightingConfig = {
      bright: { color: "#ffffff", glow: "rgba(255, 255, 255, 0.9)", opacity: "0.85", status: "01 BRIGHT (100% COOL WHITE)" },
      dim: { color: "#ffaa33", glow: "rgba(255, 170, 51, 0.4)", opacity: "0.35", status: "02 DIM / MOVIE (20% WARM)" },
      warm: { color: "#ff8800", glow: "rgba(255, 136, 0, 0.75)", opacity: "0.85", status: "03 AMBIENT 2700K KELVIN" },
      party: { color: "#00f0ff", glow: "rgba(0, 240, 255, 0.8)", opacity: "0.75", status: "04 DALI BLUE NIGHT MODE" },
      off: { color: "#222222", glow: "rgba(0, 0, 0, 0)", opacity: "0.05", status: "06 ALL OFF (0% LOAD)" }
    };

    function applyScene(sceneName, targetBtn) {
      if (sceneName === 'shades') {
        isCurtainOpen = !isCurtainOpen;
        targetBtn.classList.toggle('active', isCurtainOpen);
        updateAtmosphereView();
        return;
      }

      keypadButtons.forEach(b => {
        if(b.getAttribute('data-scene') !== 'shades') b.classList.remove('active');
      });
      if(targetBtn) targetBtn.classList.add('active');

      const config = sceneLightingConfig[sceneName] || sceneLightingConfig.warm;
      root.style.setProperty('--fixture-color', config.color);
      root.style.setProperty('--fixture-glow', config.glow);
      root.style.setProperty('--beam-opacity', config.opacity);
      document.getElementById('processorStatusText').textContent = config.status;
    }

    keypadButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        applyScene(btn.getAttribute('data-scene'), btn);

let currentViewTab = 'search';
let activePlaylistName = 'Mood';

function getAllPlaylists() {
  let data = localStorage.getItem('lutron_custom_playlists');
  return data ? JSON.parse(data) : { 'Mood': JSON.parse(localStorage.getItem('my_custom_mood') || '[]') };
}

function saveAllPlaylists(data) {
  localStorage.setItem('lutron_custom_playlists', JSON.stringify(data));
}

function createNewPlaylist() {
  let name = prompt("Nayi Playlist ka naam daalo (e.g. 90s, Romantic, Gym):");
  if (!name || !name.trim()) return;
  let cleanName = name.trim();
  let all = getAllPlaylists();
  if (!all[cleanName]) {
    all[cleanName] = [];
    saveAllPlaylists(all);
    activePlaylistName = cleanName;
    currentViewTab = 'my_playlists';
    renderPlaylistDrawer();
  } else {
    alert("Yeh Playlist pehle se bani hui hai!");
  }
}

function addToSelectedPlaylist(song) {
  let all = getAllPlaylists();
  let list = all[activePlaylistName] || [];
  if (!list.some(s => s.id === song.id)) {
    list.push(song);
    all[activePlaylistName] = list;
    saveAllPlaylists(all);
    alert(`"${song.name || song.title}" saved to [${activePlaylistName}]!`);
  } else {
    alert(`Pehle se [${activePlaylistName}] playlist me hai!`);
  }
}

function removeSongFromPlaylist(songId) {
  let all = getAllPlaylists();
  if (all[activePlaylistName]) {
    all[activePlaylistName] = all[activePlaylistName].filter(s => s.id !== songId);
    saveAllPlaylists(all);
    renderPlaylistDrawer();
  }
}

function renderPlaylistDrawer() {
  let allPlaylists = getAllPlaylists();
  let playlistNames = Object.keys(allPlaylists);
  if (!playlistNames.includes(activePlaylistName)) {
    activePlaylistName = playlistNames[0] || 'Mood';
  }

  let dropdownOptions = playlistNames.map(name => `<option value="${name}" ${name === activePlaylistName ? 'selected' : ''}>📁 ${name}</option>`).join('');

  playlistDrawer.innerHTML = `
    <div style="display:flex; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:6px;">
      <button onclick="switchTab('search')" style="flex:1; padding:8px; background:${currentViewTab==='search'?'rgba(249,115,22,0.2)':'transparent'}; color:${currentViewTab==='search'?'#f97316':'#94a3b8'}; border:none; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:bold; cursor:pointer;">SEARCH RESULTS</button>
      <button onclick="switchTab('my_playlists')" style="flex:1; padding:8px; background:${currentViewTab==='my_playlists'?'rgba(249,115,22,0.2)':'transparent'}; color:${currentViewTab==='my_playlists'?'#f97316':'#94a3b8'}; border:none; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:bold; cursor:pointer;">MY PLAYLISTS</button>
    </div>

    ${currentViewTab === 'my_playlists' ? `
      <div style="display:flex; gap:6px; padding:6px 8px; align-items:center; background:rgba(0,0,0,0.3); border-bottom:1px solid rgba(255,255,255,0.08);">
        <select onchange="activePlaylistName=this.value; renderPlaylistDrawer();" style="flex:1; background:#0f172a; color:#f97316; border:1px solid rgba(255,255,255,0.15); border-radius:4px; padding:4px 6px; font-size:10px; font-family:'JetBrains Mono',monospace; outline:none;">
          ${dropdownOptions}
        </select>
        <button onclick="createNewPlaylist()" style="background:#f97316; color:#000; border:none; border-radius:4px; padding:4px 8px; font-size:10px; font-weight:bold; font-family:'JetBrains Mono',monospace; cursor:pointer;">+ NEW</button>
      </div>
    ` : ''}
  `;

  let activeList = (currentViewTab === 'search') ? songsList : (allPlaylists[activePlaylistName] || []);

  if (activeList.length === 0) {
    const emptyMsg = document.createElement('div');
    emptyMsg.style.cssText = "padding:20px; text-align:center; color:#94a3b8; font-size:11px; font-family:'JetBrains Mono',monospace;";
    emptyMsg.innerHTML = currentViewTab === 'search' ? "No songs loaded." : `"${activePlaylistName}" is empty.<br>Click '+ ADD' on search results!`;
    playlistDrawer.appendChild(emptyMsg);
    return;
  }

  activeList.forEach((song, idx) => {
    const item = document.createElement('div');
    item.className = `playlist-item ${idx === currentTrackIndex ? 'active-track' : ''}`;
    item.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px; overflow:hidden; max-width:65%;">
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🎵 ${song.name || song.title}</span>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        ${currentViewTab === 'search' ? `
          <button onclick='event.stopPropagation(); addToSelectedPlaylist(${JSON.stringify(song)})' style="background:#f97316; color:#000; border:none; border-radius:4px; padding:2px 6px; font-weight:bold; font-size:10px; cursor:pointer;">+ ADD</button>
        ` : `
          <button onclick='event.stopPropagation(); removeSongFromPlaylist("${song.id}")' title="Delete Song" style="background:#ef4444; color:#fff; border:none; border-radius:4px; padding:2px 6px; font-size:10px; font-weight:bold; cursor:pointer;">✖</button>
        `}
        <span style="font-size:0.7rem; color:var(--amber-warm); font-weight:bold; cursor:pointer;">▶ PLAY</span>
      </div>
    `;
    item.addEventListener('click', () => {
      currentTrackIndex = idx;
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(song.id);
      }
      updateTrackInfo();
      playlistDrawer.classList.remove('open');
    });
    playlistDrawer.appendChild(item);
  });
}

function switchTab(tabName) {
  currentViewTab = tabName;
  renderPlaylistDrawer();
}
function switchTab(tabName) {
  currentViewTab = tabName;
  renderPlaylistDrawer();
}

    playlistToggleBtn.addEventListener('click', () => {
      playlistDrawer.classList.toggle('open');
    });

    // SEARCH LOGIC
    const songQueryInput = document.getElementById('songQueryInput');
    const searchSubmitBtn = document.getElementById('searchSubmitBtn');

    async function executeLiveYouTubeSearch() {
      const rawQuery = songQueryInput.value.trim();
      if (!rawQuery) return;

      searchSubmitBtn.textContent = "SEARCHING...";

      try {
        // Priority to YouTube Music official studio masters (-Topic / Official Audio)
        // Eliminates noisy video intros/outros and low-bitrate rips
        const studioQuery = encodeURIComponent(`${rawQuery} "Topic" OR "Official Audio" -jukebox -mashup -nonstop -teaser -trailer`);
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${studioQuery}&type=video&videoDuration=medium&key=${YT_API_KEY}`;
        
        const res = await fetch(url);
        const data = await res.json();

        if (data.items && data.items.length > 0) {
          // Clean filter: unwanted low-quality tags drop karein
          const filteredItems = data.items.filter(item => {
            const title = item.snippet.title.toLowerCase();
            return !title.includes("jukebox") && 
                   !title.includes("full album") && 
                   !title.includes("top 10") && 
                   !title.includes("status video");
          });

          const finalItems = filteredItems.length > 0 ? filteredItems : data.items;

          songsList = finalItems.map(item => ({
            id: item.id.videoId,
            name: item.snippet.title
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&amp;/g, '&')
              .replace(/\(Official Audio\)/gi, '')
              .replace(/\(Audio\)/gi, '')
              .replace(/-\s*Topic/gi, '')
              .trim(),
            img: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
          }));

          renderPlaylistDrawer();
          playlistDrawer.classList.add('open');
          playTrackAtIndex(0);
        } else {
          alert("No high-definition audio found for this query!");
        }
      } catch (err) {
        console.error("Studio Search Error:", err);
      } finally {
        searchSubmitBtn.textContent = "SEARCH";
      }
    }

    searchSubmitBtn.addEventListener('click', executeLiveYouTubeSearch);
    songQueryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeLiveYouTubeSearch();
    });

    // YOUTUBE PLAYER INIT
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('yt-player', {
        height: '200',
        width: '200',
        videoId: songsList[0].id,
        playerVars: { 
            'autoplay': 0, 
            'controls': 0, 
            'playsinline': 1,
            'rel': 0,
            'vq': 'hd1080'
        },
        events: {
            'onReady': (e) => {
                if (e.target.setPlaybackQuality) e.target.setPlaybackQuality('hd1080');
                renderPlaylistDrawer();
                updateTrackInfo();
            },
            'onStateChange': onPlayerStateChange
        }
    });
};

    function playTrackAtIndex(index) {
      currentTrackIndex = index;
      const track = songsList[currentTrackIndex];
      if (!track) return;

      renderPlaylistDrawer();
      updateTrackInfo();
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(track.id);
        if (bgAudio) bgAudio.play().catch(()=>{});
      }
    }

    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        if (bgAudio) bgAudio.play().catch(()=>{});
        startTimer();
      } else if (event.data === YT.PlayerState.ENDED) {
        currentTrackIndex = (currentTrackIndex + 1) % songsList.length;
        playTrackAtIndex(currentTrackIndex);
      } else {
        isPlaying = false;
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        stopTimer();
      }
    }

    function updateTrackInfo() {
      const track = songsList[currentTrackIndex];
      if (track) {
        document.getElementById('trackTitle').textContent = track.name;
        document.getElementById('trackArtist').textContent = "Full Track (YouTube)";
        if (track.img) document.getElementById('albumImg').src = track.img;

        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: track.name,
            artist: "Lutron Technician",
            artwork: [{ src: track.img || '', sizes: '512x512', type: 'image/jpeg' }]
          });
          navigator.mediaSession.setActionHandler('play', () => { 
            if (player && typeof player.playVideo === 'function') player.playVideo();
            if (bgAudio) bgAudio.play().catch(()=>{});
          });
          navigator.mediaSession.setActionHandler('pause', () => { 
            if (player && typeof player.pauseVideo === 'function') player.pauseVideo();
          });
          navigator.mediaSession.setActionHandler('nexttrack', () => {
            currentTrackIndex = (currentTrackIndex + 1) % songsList.length;
            playTrackAtIndex(currentTrackIndex);
          });
          navigator.mediaSession.setActionHandler('previoustrack', () => {
            currentTrackIndex = (currentTrackIndex - 1 + songsList.length) % songsList.length;
            playTrackAtIndex(currentTrackIndex);
          });
        }
      }
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startTimer() {
      stopTimer();
      progressTimer = setInterval(() => {
        if (player && typeof player.getCurrentTime === 'function') {
          const cur = player.getCurrentTime();
          const dur = player.getDuration();
          document.getElementById('currentTime').textContent = formatTime(cur);
          document.getElementById('totalTime').textContent = formatTime(dur);
          if (dur > 0) {
            document.getElementById('progressBarFill').style.width = `${(cur / dur) * 100}%`;
          }
        }
      }, 500);
    }

    function stopTimer() {
      if (progressTimer) clearInterval(progressTimer);
    }

    playPauseBtn.addEventListener('click', () => {
      if (player && typeof player.playVideo === 'function') {
        if (isPlaying) {
          player.pauseVideo();
        } else {
          player.playVideo();
          if (bgAudio) bgAudio.play().catch(()=>{});
        }
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex + 1) % songsList.length;
      playTrackAtIndex(currentTrackIndex);
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex - 1 + songsList.length) % songsList.length;
      playTrackAtIndex(currentTrackIndex);
    });

    document.getElementById('progressBarBg').addEventListener('click', (e) => {
      if (player && typeof player.getDuration === 'function') {
        const rect = e.currentTarget.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        const dur = player.getDuration();
        if (dur > 0) player.seekTo(dur * pos, true);
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && isPlaying && player && typeof player.playVideo === 'function') {
        player.playVideo();
      }
    });

    updateAtmosphereView();
    renderPlaylistDrawer();
function addToMyPlaylist(song) {
  let list = JSON.parse(localStorage.getItem('my_custom_mood') || '[]');
  if (!list.some(s => s.id === song.id)) {
    list.push(song);
    localStorage.setItem('my_custom_mood', JSON.stringify(list));
    alert('Added to your personal Mood playlist!');
  } else {
    alert('Already in your playlist!');
  }
}
