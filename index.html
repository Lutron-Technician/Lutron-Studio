<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lutron Technician — Studio Audio & Lighting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Viewport Engine */
    .viewport-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background: radial-gradient(circle at 80% 20%, #ff8c42 0%, #1e1b4b 50%, #030712 90%);
      transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .viewport-bg.night {
      background: radial-gradient(circle at 80% 20%, #4338ca 0%, #090d16 60%, #020408 100%);
    }

    .viewport-bg.dali-blue {
      background: radial-gradient(circle at 50% 50%, #0284c7 0%, #0f172a 70%, #020617 100%);
    }

    .viewport-bg.ambient-warm {
      background: radial-gradient(circle at 50% 40%, #ea580c 0%, #311506 60%, #0a0503 100%);
    }

    .viewport-bg.all-off {
      background: #000000;
    }

    /* Sun Glow & Mountain Silhouettes */
    .sun-orb {
      position: absolute;
      top: 18%;
      right: 15%;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, #fef08a 10%, #f97316 80%);
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(249, 115, 22, 0.6);
      transition: all 1.2s ease;
    }

    .viewport-bg.night .sun-orb {
      background: radial-gradient(circle, #e0e7ff 10%, #6366f1 80%);
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.4);
    }

    .viewport-bg.all-off .sun-orb {
      opacity: 0;
    }

    .mountain-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 350px;
      background: linear-gradient(175deg, transparent 40%, #064e3b 40.1%, #022c22 100%);
      clip-path: polygon(0 100%, 0 65%, 25% 45%, 50% 70%, 75% 35%, 100% 60%, 100% 100%);
      transition: filter 1s ease;
    }

    .viewport-bg.night .mountain-layer {
      filter: brightness(0.2) hue-rotate(180deg);
    }

    .viewport-bg.all-off .mountain-layer {
      opacity: 0.05;
    }

    /* Architectural Hanging Pendants */
    .pendant-rig {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
    }

    .pendant {
      position: absolute;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 1s ease;
    }

    .pendant.pendant-left { right: 34%; }
    .pendant.pendant-right { right: 10%; }

    .cord {
      width: 2px;
      height: 220px;
      background: rgba(255, 255, 255, 0.25);
    }

    .fixture-head {
      width: 32px;
      height: 20px;
      background: #1e293b;
      border-radius: 4px 4px 0 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .light-cone {
      width: 160px;
      height: 480px;
      background: linear-gradient(180deg, rgba(251, 146, 60, 0.45) 0%, rgba(251, 146, 60, 0.0) 100%);
      clip-path: polygon(40% 0%, 60% 0%, 100% 100%, 0% 100%);
      filter: blur(10px);
      transition: opacity 1s ease;
    }

    .viewport-bg.all-off ~ .pendant-rig .light-cone {
      opacity: 0;
    }

    .viewport-bg.dali-blue ~ .pendant-rig .light-cone {
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.45) 0%, rgba(56, 189, 248, 0.0) 100%);
    }

    /* Drapery Track Animation */
    .drapery-track {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.8s ease;
    }

    .curtain {
      width: 50vw;
      height: 100vh;
      background: repeating-linear-gradient(90deg, #18181b, #27272a 30px, #09090b 60px);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.95);
      transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .curtain.left { transform: translateX(-100%); }
    .curtain.right { transform: translateX(100%); }

    .curtains-closed .curtain.left { transform: translateX(0); }
    .curtains-closed .curtain.right { transform: translateX(0); }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(3,7,18,0.85) 0%, transparent 100%);
    }

    .branding-box h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #f8fafc;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255,255,255,0.3);
    }

    .branding-box p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: #f97316;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    /* Keypad & Central Dashboard */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1300px;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-grow: 1;
    }

    .keypad-chassis {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      width: 280px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .keypad-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .keypad-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(249, 115, 22, 0.4);
      color: #fff;
    }

    .keypad-btn.active {
      background: rgba(249, 115, 22, 0.15);
      border-color: #f97316;
      color: #fff;
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
    }

    .led-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #334155;
      transition: all 0.3s;
    }

    .keypad-btn.active .led-dot {
      background: #f97316;
      box-shadow: 0 0 10px #f97316;
    }

    /* Playlist Drawer */
    .playlist-drawer {
      position: absolute;
      right: 40px;
      bottom: 120px;
      width: 400px;
      max-height: 480px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.4s ease;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
    }

    .playlist-drawer.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .drawer-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.3);
    }

    .drawer-tab-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .drawer-tab-btn.active {
      color: #f97316;
      border-bottom: 2px solid #f97316;
      background: rgba(249, 115, 22, 0.05);
    }

    .drawer-actions-bar {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .create-pl-btn {
      background: #f97316;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .playlist-items-container {
      overflow-y: auto;
      max-height: 400px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s;
    }

    .song-row:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .song-row.active {
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: #f97316;
    }

    .song-row-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .add-fav-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 4px;
      color: #f97316;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-fav-btn:hover {
      background: #f97316;
      color: #000;
    }

    /* Hi-Fi Studio Player Console */
    footer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1000px;
      margin-bottom: 24px;
      padding: 0 20px;
    }

    .player-deck {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.75);
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      outline: none;
      transition: all 0.3s;
    }

    .search-input:focus {
      border-color: #f97316;
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.25);
    }

    .search-btn, .toggle-drawer-btn {
      background: #f97316;
      color: #0b0f19;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .search-btn:hover {
      background: #ea580c;
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
    }

    .toggle-drawer-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .toggle-drawer-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 320px;
    }

    .track-art {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #1e293b;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .track-text h4 {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .track-text p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #f97316;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .deck-buttons {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .circle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 14px;
      transition: all 0.2s;
    }

    .circle-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .circle-btn.play-pause {
      background: #f97316;
      color: #0b0f19;
      width: 46px;
      height: 46px;
      font-size: 18px;
      border: none;
    }

    .circle-btn.play-pause:hover {
      background: #fb923c;
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #f97316;
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    .time-indicators {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #64748b;
      margin-top: -6px;
    }

    #yt-hidden-engine {
      position: absolute;
      top: -9999px;
      left: -9999px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Ambient Stage Viewport -->
  <div class="viewport-bg" id="ambientBg">
    <div class="sun-orb"></div>
    <div class="mountain-layer"></div>
  </div>

  <!-- Hanging Pendants -->
  <div class="pendant-rig">
    <div class="pendant pendant-left">
      <div class="cord"></div>
      <div class="fixture-head"></div>
      <div class="light-cone"></div>
    </div>
    <div class="pendant pendant-right">
      <div class="cord"></div>
      <div class="fixture-head"></div>
      <div class="light-cone"></div>
    </div>
  </div>

  <!-- Drapery Tracks -->
  <div class="drapery-track" id="draperyTrack">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="branding-box">
      <h1>Lutron Technician</h1>
      <p>SYSTEM PROGRAMMER • ARCHITECTURAL LIGHTING & MOTORIZED DRAPERY</p>
    </div>
    <div class="status-badge" id="draperyLabel">
      ● SCENE: 01 BRIGHT (STAGE VIEW)
    </div>
  </header>

  <!-- Keypad & Drawer Container -->
  <main>
    <div class="keypad-chassis">
      <button class="keypad-btn active" data-scene="bright">
        <span>01 BRIGHT</span>
        <div class="led-dot"></div>
      </button>
      <button class="keypad-btn" data-scene="dim">
        <span>02 DIM / MOVIE</span>
        <div class="led-dot"></div>
      </button>
      <button class="keypad-btn" data-scene="warm">
        <span>03 AMBIENT 2700K</span>
        <div class="led-dot"></div>
      </button>
      <button class="keypad-btn" data-scene="dali">
        <span>04 DALI BLUE</span>
        <div class="led-dot"></div>
      </button>
      <button class="keypad-btn" data-scene="drapery" id="draperyToggleBtn">
        <span id="draperyBtnText">05 DRAPERY: OPEN</span>
        <div class="led-dot"></div>
      </button>
      <button class="keypad-btn" data-scene="off">
        <span>06 ALL OFF</span>
        <div class="led-dot"></div>
      </button>
    </div>

    <!-- Dual Tab Playlist Drawer -->
    <div class="playlist-drawer" id="playlistDrawer">
      <div class="drawer-tabs">
        <button class="drawer-tab-btn active" id="tabSearchBtn" onclick="switchDrawerTab('search')">SEARCH RESULTS</button>
        <button class="drawer-tab-btn" id="tabFavsBtn" onclick="switchDrawerTab('favs')">MY PLAYLISTS</button>
      </div>

      <div class="drawer-actions-bar" id="favsActions" style="display: none;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #94a3b8;" id="activePlaylistLabel">Folder: Mood</span>
        <button class="create-pl-btn" onclick="createNewCustomFolder()">+ NEW FOLDER</button>
      </div>

      <div class="playlist-items-container" id="playlistItemsList">
        <!-- Dynamic elements -->
      </div>
    </div>
  </main>

  <!-- Player Deck Footer -->
  <footer>
    <div class="player-deck">
      <div class="search-row">
        <input type="text" class="search-input" id="songQueryInput" placeholder="Search track, artist, album (e.g. Awarapan, Arijit, Coke Studio)..." />
        <button class="search-btn" id="searchSubmitBtn">SEARCH</button>
        <button class="toggle-drawer-btn" id="drawerToggleBtn">SONGS</button>
      </div>

      <div class="control-row">
        <div class="track-meta">
          <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop&q=80" alt="Cover" class="track-art" id="playerThumb" />
          <div class="track-text">
            <h4 id="playerTrackTitle">Ready to Play</h4>
            <p id="playerSubtitle">STUDIO MASTER • 256 KBPS HD</p>
          </div>
        </div>

        <div class="deck-buttons">
          <button class="circle-btn" id="prevBtn">⏮</button>
          <button class="circle-btn play-pause" id="playPauseBtn">▶</button>
          <button class="circle-btn" id="nextBtn">⏭</button>
        </div>
      </div>

      <div class="progress-bar-wrap" id="progressBarBg">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="time-indicators">
        <span id="currentTimeLabel">0:00</span>
        <span id="totalDurationLabel">0:00</span>
      </div>
    </div>
  </footer>

  <!-- YouTube Hidden Hi-Fi Stream Engine -->
  <div id="yt-hidden-engine"></div>

  <script src="https://www.youtube-nocookie.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;
    let currentTrackIndex = 0;
    let currentTab = 'search'; 
    let currentFavFolder = 'Mood';

    // Initial Default Tracks
    let songsList = [
      { id: "cmMiyZaSELo", name: "Toh Phir Aao — Lounge Master", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=150" },
      { id: "f6ZbgoxzQ50", name: "Tera Mera Rishta — Acoustic Session", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" }
    ];

    // LocalStorage Persistent Personal Playlists
    function getPersonalPlaylists() {
      const data = localStorage.getItem('lutron_user_playlists');
      if (data) {
        try { return JSON.parse(data); } catch(e) { return { "Mood": [] }; }
      }
      return { "Mood": [] };
    }

    function savePersonalPlaylists(obj) {
      localStorage.setItem('lutron_user_playlists', JSON.stringify(obj));
    }

    // Palladiom Lighting Controls
    const ambientBg = document.getElementById('ambientBg');
    const draperyTrack = document.getElementById('draperyTrack');
    const draperyLabel = document.getElementById('draperyLabel');
    const draperyBtnText = document.getElementById('draperyBtnText');
    const keypadBtns = document.querySelectorAll('.keypad-btn');
    let draperyClosed = false;

    keypadBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const scene = btn.getAttribute('data-scene');

        if (scene === 'drapery') {
          draperyClosed = !draperyClosed;
          draperyTrack.classList.toggle('curtains-closed', draperyClosed);
          draperyBtnText.textContent = draperyClosed ? "05 DRAPERY: CLOSED" : "05 DRAPERY: OPEN";
          draperyLabel.textContent = draperyClosed ? "● SCENE: DRAPERY CLOSED (PRIVACY)" : "● SCENE: DRAPERY OPEN";
          btn.classList.toggle('active', draperyClosed);
          return;
        }

        keypadBtns.forEach(b => {
          if (b.getAttribute('data-scene') !== 'drapery') b.classList.remove('active');
        });
        btn.classList.add('active');

        ambientBg.className = 'viewport-bg';
        if (scene === 'bright') draperyLabel.textContent = "● SCENE: 01 BRIGHT (STAGE VIEW)";
        if (scene === 'dim') { ambientBg.classList.add('night'); draperyLabel.textContent = "● SCENE: 02 MOVIE DIM"; }
        if (scene === 'warm') { ambientBg.classList.add('ambient-warm'); draperyLabel.textContent = "● SCENE: 03 AMBIENT 2700K"; }
        if (scene === 'dali') { ambientBg.classList.add('dali-blue'); draperyLabel.textContent = "● SCENE: 04 DALI BLUE"; }
        if (scene === 'off') { ambientBg.classList.add('all-off'); draperyLabel.textContent = "● SCENE: 06 ALL OFF"; }
      });
    });

    // YouTube API Initialization with 256kbps / HD Lock
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-hidden-engine', {
        height: '0',
        width: '0',
        videoId: songsList[0].id,
        host: 'https://www.youtube-nocookie.com',
        playerVars: { 
          'autoplay': 0, 
          'controls': 0, 
          'playsinline': 1,
          'rel': 0,
          'modestbranding': 1,
          'vq': 'hd1080'
        },
        events: {
          'onReady': (e) => {
            if (e.target.setPlaybackQuality) {
              e.target.setPlaybackQuality('hd1080');
            }
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('playPauseBtn').textContent = '⏸';
        if (player.setPlaybackQuality) {
          player.setPlaybackQuality('hd1080'); // Force 256kbps audio track container
        }
      } else if (event.data === YT.PlayerState.ENDED) {
        playNextTrack();
      } else {
        isPlaying = false;
        document.getElementById('playPauseBtn').textContent = '▶';
      }
    }

    // Playback Engine
    function playTrackAtIndex(idx) {
      const list = (currentTab === 'search') ? songsList : getPersonalPlaylists()[currentFavFolder] || [];
      if (!list || !list[idx]) return;

      currentTrackIndex = idx;
      const track = list[idx];

      document.getElementById('playerTrackTitle').textContent = track.name;
      document.getElementById('playerThumb').src = track.img || "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100";
      
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById({
          videoId: track.id,
          suggestedQuality: 'hd1080'
        });
        player.playVideo();
      }
      renderPlaylistDrawer();
    }

    function playNextTrack() {
      const list = (currentTab === 'search') ? songsList : getPersonalPlaylists()[currentFavFolder] || [];
      if (list.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % list.length;
      playTrackAtIndex(currentTrackIndex);
    }

    // Drawer Tabs & Dynamic Manager
    function switchDrawerTab(tab) {
      currentTab = tab;
      document.getElementById('tabSearchBtn').classList.toggle('active', tab === 'search');
      document.getElementById('tabFavsBtn').classList.toggle('active', tab === 'favs');
      document.getElementById('favsActions').style.display = (tab === 'favs') ? 'flex' : 'none';
      renderPlaylistDrawer();
    }

    function createNewCustomFolder() {
      const name = prompt("Enter new Playlist name (e.g. Mood, Drive, Focus):");
      if (!name || !name.trim()) return;
      const playlists = getPersonalPlaylists();
      if (!playlists[name.trim()]) {
        playlists[name.trim()] = [];
        savePersonalPlaylists(playlists);
        currentFavFolder = name.trim();
        document.getElementById('activePlaylistLabel').textContent = "Folder: " + currentFavFolder;
        renderPlaylistDrawer();
      }
    }

    function addSongToFolder(song) {
      const playlists = getPersonalPlaylists();
      const folderNames = Object.keys(playlists);
      const chosen = prompt(`Add track to which playlist?\nOptions: ${folderNames.join(', ')}`, folderNames[0]);
      
      if (chosen && playlists[chosen]) {
        if (!playlists[chosen].some(s => s.id === song.id)) {
          playlists[chosen].push(song);
          savePersonalPlaylists(playlists);
          alert(`Added to "${chosen}"!`);
        } else {
          alert("This track is already in your playlist!");
        }
      }
    }

    function renderPlaylistDrawer() {
      const container = document.getElementById('playlistItemsList');
      container.innerHTML = '';

      if (currentTab === 'search') {
        songsList.forEach((song, idx) => {
          const row = document.createElement('div');
          row.className = `song-row ${idx === currentTrackIndex ? 'active' : ''}`;
          row.innerHTML = `
            <span class="song-row-title" onclick="playTrackAtIndex(${idx})">🎵 ${song.name}</span>
            <button class="add-fav-btn" title="Add to My Playlist" onclick='event.stopPropagation(); addSongToFolder(${JSON.stringify(song)})'>+ ADD</button>
          `;
          container.appendChild(row);
        });
      } else {
        const playlists = getPersonalPlaylists();
        const activeList = playlists[currentFavFolder] || [];

        if (activeList.length === 0) {
          container.innerHTML = `<div style="text-align: center; color: #64748b; padding: 25px; font-size: 11px; font-family: 'JetBrains Mono';">Folder "${currentFavFolder}" is empty.<br>Search tracks and click "+ ADD"!</div>`;
          return;
        }

        activeList.forEach((song, idx) => {
          const row = document.createElement('div');
          row.className = `song-row ${idx === currentTrackIndex ? 'active' : ''}`;
          row.innerHTML = `
            <span class="song-row-title" onclick="playTrackAtIndex(${idx})">🎧 ${song.name}</span>
            <span style="font-size: 11px; color: #f97316; font-weight: bold;" onclick="playTrackAtIndex(${idx})">▶ PLAY</span>
          `;
          container.appendChild(row);
        });
      }
    }

    // Zero-Key Direct Studio Search Engine (Piped Public Invidious API)
    const songQueryInput = document.getElementById('songQueryInput');
    const searchSubmitBtn = document.getElementById('searchSubmitBtn');

    async function executeLiveStudioSearch() {
      const rawQuery = songQueryInput.value.trim();
      if (!rawQuery) return;

      searchSubmitBtn.textContent = "SEARCHING...";

      try {
        const endpoints = [
          `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(rawQuery + ' official audio topic')}&filter=music_songs`,
          `https://api.invidious.io/search?q=${encodeURIComponent(rawQuery + ' audio')}`
        ];

        let results = [];
        const res = await fetch(endpoints[0]);
        const data = await res.json();

        if (data && data.items && data.items.length > 0) {
          results = data.items.filter(item => item.type === 'stream' || item.url).slice(0, 15).map(item => ({
            id: item.url ? item.url.replace('/watch?v=', '') : item.id,
            name: item.title.replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\(Official Audio\)/gi, '').replace(/-\s*Topic/gi, '').trim(),
            img: item.thumbnail
          }));
        }

        if (results.length > 0) {
          songsList = results;
          switchDrawerTab('search');
          document.getElementById('playlistDrawer').classList.add('open');
          playTrackAtIndex(0);
        } else {
          // Fallback direct embed search
          document.getElementById('playlistDrawer').classList.add('open');
        }
      } catch (err) {
        console.warn("Direct stream fetch, opening direct list:", err);
      } finally {
        searchSubmitBtn.textContent = "SEARCH";
      }
    }

    searchSubmitBtn.addEventListener('click', executeLiveStudioSearch);
    songQueryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeLiveStudioSearch();
    });

    // Audio Navigation Controls
    document.getElementById('playPauseBtn').addEventListener('click', () => {
      if (!player) return;
      if (isPlaying) { player.pauseVideo(); } else { player.playVideo(); }
    });

    document.getElementById('nextBtn').addEventListener('click', playNextTrack);
    document.getElementById('prevBtn').addEventListener('click', () => {
      const list = (currentTab === 'search') ? songsList : getPersonalPlaylists()[currentFavFolder] || [];
      if (list.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + list.length) % list.length;
      playTrackAtIndex(currentTrackIndex);
    });

    document.getElementById('drawerToggleBtn').addEventListener('click', () => {
      document.getElementById('playlistDrawer').classList.toggle('open');
    });

    // Time & Progress Tracker
    setInterval(() => {
      if (player && typeof player.getCurrentTime === 'function' && isPlaying) {
        const cur = player.getCurrentTime();
        const dur = player.getDuration();
        if (dur > 0) {
          document.getElementById('progressFill').style.width = `${(cur / dur) * 100}%`;
          document.getElementById('currentTimeLabel').textContent = formatSeconds(cur);
          document.getElementById('totalDurationLabel').textContent = formatSeconds(dur);
        }
      }
    }, 500);

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    document.getElementById('progressBarBg').addEventListener('click', (e) => {
      if (player && typeof player.getDuration === 'function') {
        const rect = e.currentTarget.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        player.seekTo(pos * player.getDuration(), true);
      }
    });

    renderPlaylistDrawer();
  </script>
</body>
</html>
