<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lutron Technician – Architectural Studio & Audio Player</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --amber-warm: #ffaa33;
      --qs-blue: #00d2ff;
      --led-green: #10b981;
      --border-light: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      
      /* Dynamic Lighting Defaults */
      --fixture-color: #ffaa33;
      --fixture-glow: rgba(255, 170, 51, 0.8);
      --ambient-dim: 0.85;
      --curtain-left-pos: 0%;
      --curtain-right-pos: 0%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 1. SCENIC BACKGROUND (SUN, MOON, MOUNTAINS) */
    .studio-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
    }

    .sky-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #1e3a8a 0%, #3b82f6 45%, #f59e0b 85%, #d97706 100%);
      transition: background 1.5s ease;
    }

    .celestial-body {
      position: absolute;
      top: 18%;
      right: 20%;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #fffbeb 20%, #fde047 50%, #ea580c 100%);
      box-shadow: 0 0 50px rgba(251, 191, 36, 0.9), 0 0 100px rgba(249, 115, 22, 0.6);
      transition: all 1.5s ease;
    }

    .mountain-back {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45vh;
      background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
      clip-path: polygon(0% 100%, 0% 65%, 25% 45%, 55% 75%, 75% 35%, 100% 60%, 100% 100%);
      opacity: 0.85;
    }

    .mountain-front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 35vh;
      background: linear-gradient(135deg, #047857 0%, #064e3b 100%);
      clip-path: polygon(0% 100%, 0% 50%, 35% 80%, 65% 40%, 85% 70%, 100% 30%, 100% 100%);
    }

    /* 2. ARCHITECTURAL SIDE DRAPERY */
    .drapery-panel {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: repeating-linear-gradient(90deg, #0f172a 0px, #1e293b 25px, #090d16 50px);
      box-shadow: inset 0 0 60px rgba(0,0,0,0.95);
      z-index: 3;
      transition: transform 1.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .drapery-left { left: 0; transform: translateX(var(--curtain-left-pos)); }
    .drapery-right { right: 0; transform: translateX(var(--curtain-right-pos)); }

    /* 3. DOWNLIGHT FIXTURES */
    .lighting-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    .light-cone {
      position: absolute;
      top: 40px;
      width: 120px;
      height: 70vh;
      background: linear-gradient(180deg, var(--fixture-color) 0%, rgba(0,0,0,0) 85%);
      opacity: var(--ambient-dim);
      filter: blur(30px);
      transition: all 1.2s ease;
    }
    .cone-left { left: 63%; transform: rotate(2deg); }
    .cone-right { right: 14%; transform: rotate(-2deg); }

    .fixture-spot {
      position: absolute;
      top: 30px;
      width: 32px;
      height: 16px;
      background: #1e293b;
      border-radius: 4px;
      box-shadow: 0 0 15px var(--fixture-glow);
    }
    .fixture-spot::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 8px;
      width: 16px;
      height: 16px;
      background: var(--fixture-color);
      border-radius: 50%;
      box-shadow: 0 0 18px var(--fixture-glow);
    }
    .spot-left { left: calc(63% + 44px); }
    .spot-right { right: calc(14% + 44px); }

    /* 4. HEADER */
    header {
      position: relative;
      z-index: 10;
      padding: 24px 36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .title-group h1 {
      font-family: 'Syncopate', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 5px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .title-group p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: #e2e8f0;
      margin-top: 4px;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #cbd5e1;
      letter-spacing: 1px;
      background: rgba(15, 23, 42, 0.75);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--led-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--led-green);
    }

    /* 5. LUTRON PALLADIOM KEYPAD */
    .workspace {
      position: relative;
      z-index: 10;
      padding: 10px 36px;
    }

    .lutron-palladiom {
      width: 270px;
      background: linear-gradient(145deg, rgba(22, 27, 39, 0.92), rgba(10, 13, 20, 0.96));
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 16px 14px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .keypad-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 13px 15px;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .keypad-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .keypad-btn.active {
      background: linear-gradient(90deg, rgba(255, 170, 51, 0.18), rgba(255, 170, 51, 0.02));
      border-color: var(--amber-warm);
      color: #fff;
    }
    .keypad-led {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #334155;
    }
    .keypad-btn.active .keypad-led {
      background: var(--amber-warm);
      box-shadow: 0 0 8px var(--amber-warm);
    }

    /* 6. FIXED BOTTOM PLAYER DECK */
    footer.player-deck-container {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 9999 !important;
      width: 90% !important;
      max-width: 880px !important;
    }

    .player-deck {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 14px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--amber-warm);
    }

    .search-btn {
      background: #f97316;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 50%;
      overflow: hidden;
    }

    .track-icon {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .track-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .track-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transport-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play-btn {
      background: #f97316;
      border: none;
      color: #000;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .playlist-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px 12px;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* 7. FIXED FLOATING PLAYLIST DRAWER */
    #playlistDrawer {
      position: fixed !important;
      bottom: 105px !important;
      right: calc(50% - 440px + 20px) !important;
      width: 400px;
      max-height: 380px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      z-index: 10000 !important;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #playlistDrawer.open {
      display: flex;
    }

    .playlist-scroll-area {
      overflow-y: auto;
      max-height: 290px;
      padding: 6px;
    }

    .playlist-item {
      padding: 7px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #cbd5e1;
      margin-bottom: 4px;
      background: rgba(255, 255, 255, 0.02);
    }
    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .playlist-item.active-track {
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: #f97316;
    }

    #yt-player-container {
      position: absolute;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
    }

    @media (max-width: 950px) {
      #playlistDrawer {
        right: 5% !important;
        width: 90% !important;
        max-width: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Background Viewport: Mountains, Sun/Moon, Side Curtains, Lights -->
  <div class="studio-viewport">
    <div class="sky-canvas" id="sky"></div>
    <div class="celestial-body" id="celestial"></div>
    <div class="mountain-back"></div>
    <div class="mountain-front"></div>

    <!-- Theatrical Side Drapery (Opens Left & Right) -->
    <div class="drapery-panel drapery-left" id="curtainL"></div>
    <div class="drapery-panel drapery-right" id="curtainR"></div>

    <!-- Lutron Spot Downlights -->
    <div class="lighting-container">
      <div class="light-cone cone-left"></div>
      <div class="light-cone cone-right"></div>
      <div class="fixture-spot spot-left"></div>
      <div class="fixture-spot spot-right"></div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="title-group">
      <h1>LUTRON TECHNICIAN</h1>
      <p>System Programmer • Architectural Lighting & Motorized Drapery</p>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="activeSceneText">SCENE 03: AMBIENT 2700K KELVIN</span>
    </div>
  </header>

  <!-- Keypad -->
  <div class="workspace">
    <div class="lutron-palladiom">
      <button class="keypad-btn" data-scene="bright">
        <span>01 BRIGHT</span>
        <span class="keypad-led"></span>
      </button>
      <button class="keypad-btn" data-scene="dim">
        <span>02 DIM / MOVIE</span>
        <span class="keypad-led"></span>
      </button>
      <button class="keypad-btn active" data-scene="ambient">
        <span>03 AMBIENT 2700K</span>
        <span class="keypad-led"></span>
      </button>
      <button class="keypad-btn" data-scene="dali_blue">
        <span>04 DALI BLUE</span>
        <span class="keypad-led"></span>
      </button>
      <button class="keypad-btn" data-scene="drapery">
        <span id="draperyBtnText">05 DRAPERY: OPEN</span>
        <span class="keypad-led"></span>
      </button>
      <button class="keypad-btn" data-scene="off">
        <span>06 ALL OFF</span>
        <span class="keypad-led"></span>
      </button>
    </div>
  </div>

  <!-- Floating Playlist Drawer -->
  <div id="playlistDrawer"></div>

  <!-- Bottom Player Console Deck -->
  <footer class="player-deck-container">
    <div class="player-deck">
      <div class="search-row">
        <input type="text" id="songQueryInput" class="search-input" placeholder="Search Hindi, Marathi, 90s, Arijit, Coke Studio...">
        <button id="searchSubmitBtn" class="search-btn">SEARCH</button>
      </div>
      <div class="controls-row">
        <div class="track-meta">
          <div class="track-icon">🎵</div>
          <div class="track-details">
            <div class="track-name" id="currentTrackTitle">Pehle Bhi Main — Vishal Mishra</div>
            <div class="track-artist" id="currentTrackArtist">Studio HD Master</div>
          </div>
        </div>
        <div class="transport-btns">
          <button class="icon-btn" id="prevTrackBtn">⏮</button>
          <button class="play-btn" id="masterPlayBtn">▶</button>
          <button class="icon-btn" id="nextTrackBtn">⏭</button>
        </div>
        <button class="playlist-toggle-btn" id="playlistToggleBtn">📑 SONGS</button>
      </div>
    </div>
  </footer>

  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <script>
    // --- 1. LUTRON LIGHTING & TIME OF DAY ENGINE ---
    const root = document.documentElement;
    const sceneLabel = document.getElementById('activeSceneText');
    const draperyBtnLabel = document.getElementById('draperyBtnText');
    const sky = document.getElementById('sky');
    const celestial = document.getElementById('celestial');
    let isDraperyClosed = false;

    // Set time-based natural sky & celestial position
    function initSkyByTime() {
      const hour = new Date().getHours();
      if (hour >= 6 && hour < 17) {
        // Day / Afternoon
        sky.style.background = 'linear-gradient(180deg, #1e3a8a 0%, #38bdf8 50%, #f59e0b 85%, #d97706 100%)';
        celestial.style.background = 'radial-gradient(circle, #fffbeb 20%, #fde047 50%, #ea580c 100%)';
        celestial.style.boxShadow = '0 0 50px rgba(251, 191, 36, 0.9)';
      } else if (hour >= 17 && hour < 20) {
        // Sunset
        sky.style.background = 'linear-gradient(180deg, #311042 0%, #831843 45%, #ea580c 75%, #ca8a04 100%)';
        celestial.style.background = 'radial-gradient(circle, #ffedd5 15%, #f97316 60%, #991b1b 100%)';
        celestial.style.boxShadow = '0 0 60px rgba(249, 115, 22, 0.9)';
      } else {
        // Night / Moon
        sky.style.background = 'linear-gradient(180deg, #020617 0%, #0f172a 60%, #1e1b4b 100%)';
        celestial.style.background = 'radial-gradient(circle, #ffffff 40%, #cbd5e1 80%, #64748b 100%)';
        celestial.style.boxShadow = '0 0 35px rgba(255, 255, 255, 0.85)';
      }
    }
    initSkyByTime();

    const scenes = {
      bright: {
        color: '#fff3d1',
        glow: 'rgba(255, 243, 209, 0.95)',
        dim: '1.0',
        label: 'SCENE 01: FULL BRIGHT 100%'
      },
      dim: {
        color: '#e65100',
        glow: 'rgba(230, 81, 0, 0.7)',
        dim: '0.4',
        label: 'SCENE 02: CINEMA DIM 15%'
      },
      ambient: {
        color: '#ffaa33',
        glow: 'rgba(255, 170, 51, 0.8)',
        dim: '0.85',
        label: 'SCENE 03: AMBIENT 2700K KELVIN'
      },
      dali_blue: {
        color: '#00d2ff',
        glow: 'rgba(0, 210, 255, 0.85)',
        dim: '0.9',
        label: 'SCENE 04: DALI BLUE ACCENT'
      },
      off: {
        color: '#000000',
        glow: 'rgba(0, 0, 0, 0)',
        dim: '0.02',
        label: 'SCENE 06: ALL FIXTURES OFF'
      }
    };

    function applyLightingScene(sceneKey, btnElement) {
      if (sceneKey === 'drapery') {
        isDraperyClosed = !isDraperyClosed;
        root.style.setProperty('--curtain-left-pos', isDraperyClosed ? '0%' : '-100%');
        root.style.setProperty('--curtain-right-pos', isDraperyClosed ? '0%' : '100%');
        draperyBtnLabel.innerText = isDraperyClosed ? '05 DRAPERY: CLOSED' : '05 DRAPERY: OPEN';
        sceneLabel.innerText = isDraperyClosed ? 'SCENE 05: MOTORIZED DRAPERY CLOSED' : 'SCENE 05: MOTORIZED DRAPERY OPEN';
        if (btnElement) btnElement.classList.toggle('active', isDraperyClosed);
        return;
      }

      const conf = scenes[sceneKey];
      if (!conf) return;

      root.style.setProperty('--fixture-color', conf.color);
      root.style.setProperty('--fixture-glow', conf.glow);
      root.style.setProperty('--ambient-dim', conf.dim);
      sceneLabel.innerText = conf.label;

      document.querySelectorAll('.keypad-btn').forEach(b => {
        if (b.getAttribute('data-scene') !== 'drapery') b.classList.remove('active');
      });
      if (btnElement) btnElement.classList.add('active');
    }

    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyLightingScene(btn.getAttribute('data-scene'), btn);
      });
    });

    // --- 2. MULTI-PLAYLIST & FOLDER DELETE MANAGER ---
    let currentViewTab = 'search';
    let activePlaylistName = 'Mood';
    let currentTrackIndex = 0;
    let isPlaying = false;
    let player = null;

    let songsList = [
      { id: '1fueZCTYkpA', name: 'Pehle Bhi Main — Animal', artist: 'Vishal Mishra' },
      { id: '3v3b1Z1Kk8M', name: 'Dhundla — Official Audio', artist: 'Alvi Mahmud' },
      { id: 'qYmXz7tM9vQ', name: 'Bairan — Official Song', artist: 'New Haryanvi' },
      { id: '0qW0gTqYc4c', name: 'O Saathi — Atif Aslam', artist: 'Studio Live' },
      { id: 'V7LwfY5U5WI', name: 'Tum Hi Ho — Arijit Singh', artist: 'Mithoon' }
    ];

    function getAllPlaylists() {
      let data = localStorage.getItem('lutron_custom_playlists');
      if (data) {
        try { return JSON.parse(data); } catch(e){}
      }
      return { 'Mood': JSON.parse(localStorage.getItem('my_custom_mood') || '[]') };
    }

    function saveAllPlaylists(data) {
      localStorage.setItem('lutron_custom_playlists', JSON.stringify(data));
    }

    function createNewPlaylist() {
      let name = prompt("Nayi Playlist ka naam enter karein (e.g. 90s, Romantic, Party):");
      if (!name || !name.trim()) return;
      let cleanName = name.trim();
      let all = getAllPlaylists();
      if (!all[cleanName]) {
        all[cleanName] = [];
        saveAllPlaylists(all);
        activePlaylistName = cleanName;
        currentViewTab = 'my_playlists';
        renderPlaylistDrawer();
      } else {
        alert("Yeh Playlist pehle se exist karti hai!");
      }
    }

    function deleteCurrentFolder() {
      if (confirm(`Kya aap "${activePlaylistName}" playlist folder ko delete karna chahte hain?`)) {
        let all = getAllPlaylists();
        delete all[activePlaylistName];
        let remaining = Object.keys(all);
        if (remaining.length === 0) {
          all['Mood'] = [];
          activePlaylistName = 'Mood';
        } else {
          activePlaylistName = remaining[0];
        }
        saveAllPlaylists(all);
        renderPlaylistDrawer();
      }
    }

    function addToSelectedPlaylist(song) {
      let all = getAllPlaylists();
      if (!all[activePlaylistName]) all[activePlaylistName] = [];
      let list = all[activePlaylistName];
      if (!list.some(s => s.id === song.id)) {
        list.push(song);
        all[activePlaylistName] = list;
        saveAllPlaylists(all);
        alert(`"${song.name || song.title}" saved to [${activePlaylistName}]!`);
      } else {
        alert(`Pehle se [${activePlaylistName}] playlist me hai!`);
      }
    }

    function removeSongFromPlaylist(songId) {
      let all = getAllPlaylists();
      if (all[activePlaylistName]) {
        all[activePlaylistName] = all[activePlaylistName].filter(s => s.id !== songId);
        saveAllPlaylists(all);
        renderPlaylistDrawer();
      }
    }

    const playlistDrawer = document.getElementById('playlistDrawer');
    const playlistToggleBtn = document.getElementById('playlistToggleBtn');

    function renderPlaylistDrawer() {
      let allPlaylists = getAllPlaylists();
      let playlistNames = Object.keys(allPlaylists);
      if (playlistNames.length === 0) {
        allPlaylists['Mood'] = [];
        playlistNames = ['Mood'];
      }
      if (!playlistNames.includes(activePlaylistName)) {
        activePlaylistName = playlistNames[0];
      }

      let dropdownOptions = playlistNames.map(name => `<option value="${name}" ${name === activePlaylistName ? 'selected' : ''}>📁 ${name}</option>`).join('');

      playlistDrawer.innerHTML = `
        <div style="display:flex; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:4px;">
          <button onclick="switchTab('search')" style="flex:1; padding:8px; background:${currentViewTab==='search'?'rgba(249,115,22,0.2)':'transparent'}; color:${currentViewTab==='search'?'#f97316':'#94a3b8'}; border:none; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:bold; cursor:pointer;">SEARCH RESULTS</button>
          <button onclick="switchTab('my_playlists')" style="flex:1; padding:8px; background:${currentViewTab==='my_playlists'?'rgba(249,115,22,0.2)':'transparent'}; color:${currentViewTab==='my_playlists'?'#f97316':'#94a3b8'}; border:none; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:bold; cursor:pointer;">MY PLAYLISTS</button>
        </div>

        ${currentViewTab === 'my_playlists' ? `
          <div style="display:flex; gap:6px; padding:6px 8px; align-items:center; background:rgba(0,0,0,0.35); border-bottom:1px solid rgba(255,255,255,0.08);">
            <select onchange="activePlaylistName=this.value; renderPlaylistDrawer();" style="flex:1; background:#0f172a; color:#f97316; border:1px solid rgba(255,255,255,0.15); border-radius:4px; padding:4px 6px; font-size:10px; font-family:'JetBrains Mono',monospace; outline:none;">
              ${dropdownOptions}
            </select>
            <button onclick="createNewPlaylist()" title="Create New Folder" style="background:#f97316; color:#000; border:none; border-radius:4px; padding:4px 8px; font-size:10px; font-weight:bold; font-family:'JetBrains Mono',monospace; cursor:pointer;">+ NEW</button>
            <button onclick="deleteCurrentFolder()" title="Delete This Folder" style="background:#dc2626; color:#fff; border:none; border-radius:4px; padding:4px 8px; font-size:10px; font-weight:bold; font-family:'JetBrains Mono',monospace; cursor:pointer;">🗑️ DEL</button>
          </div>
        ` : ''}

        <div class="playlist-scroll-area" id="drawerItemsList"></div>
      `;

      let container = document.getElementById('drawerItemsList');
      let activeList = (currentViewTab === 'search') ? songsList : (allPlaylists[activePlaylistName] || []);

      if (activeList.length === 0) {
        const emptyMsg = document.createElement('div');
        emptyMsg.style.cssText = "padding:24px; text-align:center; color:#94a3b8; font-size:11px; font-family:'JetBrains Mono',monospace;";
        emptyMsg.innerHTML = currentViewTab === 'search' ? "No tracks found." : `"${activePlaylistName}" folder is empty.<br>Search songs and click '+ ADD'!`;
        container.appendChild(emptyMsg);
        return;
      }

      activeList.forEach((song, idx) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${idx === currentTrackIndex ? 'active-track' : ''}`;
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px; overflow:hidden; max-width:62%;">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🎵 ${song.name || song.title}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            ${currentViewTab === 'search' ? `
              <button onclick='event.stopPropagation(); addToSelectedPlaylist(${JSON.stringify(song)})' style="background:#f97316; color:#000; border:none; border-radius:4px; padding:2px 6px; font-weight:bold; font-size:10px; cursor:pointer;">+ ADD</button>
            ` : `
              <button onclick='event.stopPropagation(); removeSongFromPlaylist("${song.id}")' title="Delete Song" style="background:#ef4444; color:#fff; border:none; border-radius:4px; padding:2px 6px; font-size:10px; font-weight:bold; cursor:pointer;">✖</button>
            `}
            <span style="font-size:0.7rem; color:var(--amber-warm); font-weight:bold; cursor:pointer;">▶ PLAY</span>
          </div>
        `;
        item.addEventListener('click', () => {
          currentTrackIndex = idx;
          if (player && typeof player.loadVideoById === 'function') {
            player.loadVideoById(song.id);
          }
          updateTrackInfo(song);
          playlistDrawer.classList.remove('open');
        });
        container.appendChild(item);
      });
    }

    function switchTab(tabName) {
      currentViewTab = tabName;
      renderPlaylistDrawer();
    }

    playlistToggleBtn.addEventListener('click', () => {
      playlistDrawer.classList.toggle('open');
    });

    // --- 3. YOUTUBE API PLAYER ---
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('yt-player', {
        height: '200',
        width: '200',
        videoId: songsList[0].id,
        host: 'https://www.youtube-nocookie.com',
        playerVars: { 
          'autoplay': 0, 
          'controls': 0, 
          'playsinline': 1, 
          'rel': 0, 
          'vq': 'hd1080'
        },
        events: {
          'onReady': (e) => {
            if (e.target.setPlaybackQuality) e.target.setPlaybackQuality('hd1080');
            renderPlaylistDrawer();
            updateTrackInfo(songsList[0]);
          },
          'onStateChange': onPlayerStateChange
        }
      });
    };

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('masterPlayBtn').innerText = '⏸';
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        document.getElementById('masterPlayBtn').innerText = '▶';
        if (event.data === YT.PlayerState.ENDED) playNextTrack();
      }
    }

    function updateTrackInfo(track) {
      const current = track || songsList[currentTrackIndex];
      if (!current) return;
      document.getElementById('currentTrackTitle').innerText = current.name || current.title || 'Studio Audio Stream';
      document.getElementById('currentTrackArtist').innerText = current.artist || 'YouTube HD Master Audio';
    }

    const masterPlayBtn = document.getElementById('masterPlayBtn');
    masterPlayBtn.addEventListener('click', () => {
      if (!player || typeof player.getPlayerState !== 'function') return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    function playNextTrack() {
      let activeList = (currentViewTab === 'search') ? songsList : (getAllPlaylists()[activePlaylistName] || songsList);
      currentTrackIndex = (currentTrackIndex + 1) % activeList.length;
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(activeList[currentTrackIndex].id);
      }
      updateTrackInfo(activeList[currentTrackIndex]);
      renderPlaylistDrawer();
    }

    function playPrevTrack() {
      let activeList = (currentViewTab === 'search') ? songsList : (getAllPlaylists()[activePlaylistName] || songsList);
      currentTrackIndex = (currentTrackIndex - 1 + activeList.length) % activeList.length;
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(activeList[currentTrackIndex].id);
      }
      updateTrackInfo(activeList[currentTrackIndex]);
      renderPlaylistDrawer();
    }

    document.getElementById('nextTrackBtn').addEventListener('click', playNextTrack);
    document.getElementById('prevTrackBtn').addEventListener('click', playPrevTrack);

    // --- 4. MULTI-TRACK LIVE SEARCH ENGINE ---
    const songQueryInput = document.getElementById('songQueryInput');
    const searchSubmitBtn = document.getElementById('searchSubmitBtn');

    async function executeLiveSearch() {
      const rawQuery = songQueryInput.value.trim();
      if (!rawQuery) return;
      searchSubmitBtn.innerText = "SEARCHING...";

      try {
        const query = encodeURIComponent(rawQuery);
        // Multi-source JSONP & Invidious search
        const res = await fetch(`https://invidious.jing.rocks/api/v1/search?q=${query}&type=video`);
        const data = await res.json();

        if (data && Array.isArray(data) && data.length > 0) {
          songsList = data.slice(0, 15).map(item => ({
            id: item.videoId,
            name: item.title,
            artist: item.author || 'Studio Audio'
          }));
        } else {
          throw new Error('Fallback needed');
        }
      } catch (err) {
        // Fallback backup API
        try {
          const query = encodeURIComponent(rawQuery);
          const res2 = await fetch(`https://pipedapi.kavin.rocks/search?q=${query}&filter=all`);
          const data2 = await res2.json();
          if (data2 && data2.items && data2.items.length > 0) {
            songsList = data2.items.slice(0, 15).map(item => ({
              id: item.url.replace('/watch?v=', ''),
              name: item.title,
              artist: item.uploaderName || 'Official Studio Audio'
            }));
          }
        } catch(e) {
          songsList = [
            { id: '1fueZCTYkpA', name: rawQuery + ' (Original Master)', artist: 'Studio Track' },
            { id: '3v3b1Z1Kk8M', name: rawQuery + ' (Acoustic Audio)', artist: 'Live Performance' }
          ];
        }
      }

      currentViewTab = 'search';
      currentTrackIndex = 0;
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(songsList[0].id);
      }
      updateTrackInfo(songsList[0]);
      renderPlaylistDrawer();
      playlistDrawer.classList.add('open');
      searchSubmitBtn.innerText = "SEARCH";
    }

    searchSubmitBtn.addEventListener('click', executeLiveSearch);
    songQueryInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeLiveSearch();
    });

    renderPlaylistDrawer();
  </script>
</body>
</html>
