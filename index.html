<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lutron Technician — Professional Master Edition</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com">
  <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syncopate:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root { 
      --bg-dark: #07090e; 
      --bg-card: rgba(18, 22, 33, 0.92); 
      --amber-warm: #ffaa33; 
      --qs-blue: #00d2ff; 
      --led-green: #10b981; 
      --text-main: #f3f4f6; 
      --text-muted: #8a94a6; 
      --border-light: rgba(255, 255, 255, 0.08); 
      --glass-border: rgba(255, 255, 255, 0.15); 
      --fixture-color: #ffaa00; 
      --fixture-glow: rgba(255, 170, 0, 0.65); 
      --beam-opacity: 0.85; 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      font-family: 'Inter', sans-serif; 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      position: relative; 
    }

    /* Background Scenery */
    .outdoor-scenery { position: absolute; inset: 0; z-index: 1; overflow: hidden; transition: background 2s ease-in-out; }
    .outdoor-scenery.rainy-mode { background: linear-gradient(180deg, #0f172a 0%, #020617 100%); }

    /* Curtain System */
    .curtain-container { position: absolute; inset: 0; z-index: 4; pointer-events: none; display: flex; width: 100%; height: 100%; overflow: hidden; }
    .curtain-panel { width: 50%; height: 100%; background: linear-gradient(180deg, #181d28 0%, #0e121a 50%, #07090e 100%); position: relative; box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.85); will-change: transform; transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: auto; }
    .curtain-pleats { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0px, rgba(0, 0, 0, 0.5) 20px, rgba(255, 255, 255, 0.07) 40px, rgba(0, 0, 0, 0.65) 60px); }
    .curtain-left { border-right: 2px solid rgba(255,255,255,0.06); }
    .curtain-right { border-left: 2px solid rgba(255,255,255,0.06); }
    
    /* Open State for Curtains */
    .curtains-open .curtain-left { transform: translateX(-100%); }
    .curtains-open .curtain-right { transform: translateX(100%); }

    /* Lighting Layer */
    .ambient-glow { position: absolute; top: 20%; right: 5vw; width: 650px; height: 650px; background: radial-gradient(circle, var(--fixture-glow) 0%, transparent 70%); border-radius: 50%; filter: blur(80px); z-index: 6; pointer-events: none; opacity: var(--beam-opacity); }
    .lighting-fixtures-layer { position: absolute; top: 0; right: 12vw; z-index: 7; pointer-events: none; display: flex; gap: 8vw; }
    .pendant-light { display: flex; flex-direction: column; align-items: center; position: relative; }
    .pendant-1 .pendant-wire { width: 2px; height: 110px; background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.4)); }
    .pendant-2 .pendant-wire { width: 2px; height: 175px; background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.4)); }
    .pendant-shade { width: 52px; height: 28px; background: linear-gradient(180deg, #2a2f3a 0%, #11141a 100%); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px 6px 2px 2px; }
    .pendant-bulb { width: 22px; height: 22px; border-radius: 50%; background-color: var(--fixture-color); box-shadow: 0 0 25px var(--fixture-color); margin-top: -6px; }
    .light-beam { width: 220px; height: 650px; background: linear-gradient(180deg, var(--fixture-glow) 0%, transparent 100%); clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%); filter: blur(15px); opacity: var(--beam-opacity); }

    /* App Layout Container */
    .app-container { position: relative; z-index: 10; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 1.8rem 4vw; pointer-events: none; }
    .app-container > * { pointer-events: auto; }
    
    /* Header Styles */
    .top-header { width: 100%; display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); }
    .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(255, 255, 255, 0.03); padding: 0.4rem 0.8rem; border-radius: 100px; border: 1px solid var(--border-light); }
    .led-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--led-green); box-shadow: 0 0 8px var(--led-green); }
    .main-title { font-family: 'Syncopate', sans-serif; font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.5rem; background: linear-gradient(180deg, #ffffff 0%, #a0aab8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub-title { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--amber-warm); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 0.3rem; }

    /* Music Footer Player Bar */
    .player-bar { width: 100%; max-width: 600px; margin: 0 auto; background: rgba(18, 22, 33, 0.95); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .track-info { display: flex; flex-direction: column; gap: 2px; }
    .track-title { font-size: 0.9rem; font-weight: 600; color: #fff; }
    .track-artist { font-size: 0.75rem; color: var(--text-muted); }
    .player-controls { display: flex; align-items: center; gap: 15px; }
    .btn-connect-trigger { background: #ffaa33; color: #000; border: none; padding: 6px 14px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; }
    .btn-connect-trigger:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255,170,51,0.4); }

    /* =======================================================
       NEW SPOTIFY-INSPIRED CONNECT PANEL (BOTTOM SHEET)
       ======================================================= */
    .spotify-connect-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70vh;
      background: #121212;
      border-top-left-radius: 25px;
      border-top-right-radius: 25px;
      z-index: 100;
      padding: 24px;
      color: #ffffff;
      transform: translateY(100%);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
    }
    .spotify-connect-sheet.active {
      transform: translateY(0);
    }
    
    /* Overlay Background dims the rest of screen */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .sheet-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Top Handlebar Indicator */
    .sheet-handle {
      width: 40px;
      height: 5px;
      background: #404040;
      border-radius: 10px;
      margin: 0 auto 24px auto;
      cursor: pointer;
    }

    .sheet-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    /* Devices List UI */
    .device-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .device-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    /* Highlight Current Playing Active Device */
    .device-item.current-active {
      color: #1ed760; /* Spotify Green */
    }
    
    .device-icon {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
    }
    
    .device-details {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .device-name {
      font-size: 1rem;
      font-weight: 600;
    }
    .device-status {
      font-size: 0.8rem;
      color: #a7a7a7;
    }
    .current-active .device-status {
      color: #1ed760;
    }

    .spotify-green-badge {
      background: rgba(30, 215, 96, 0.1);
      color: #1ed760;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 8px;
    }

    /* Bluetooth Footer Bar */
    .bluetooth-footer {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a7a7a7;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .bluetooth-footer:hover {
      color: #fff;
    }
  </style>
</head>
<body class="curtains-open"> <!-- Toggle curtains-open to slide curtains -->

  <!-- Outdoor/Background Canvas -->
  <div class="outdoor-scenery rainy-mode"></div>

  <!-- Decorative Drapery Curtain System -->
  <div class="curtain-container">
    <div class="curtain-panel curtain-left"><div class="curtain-pleats"></div></div>
    <div class="curtain-panel curtain-right"><div class="curtain-pleats"></div></div>
  </div>

  <!-- Dynamic Architectural Lighting Beams -->
  <div class="ambient-glow"></div>
  <div class="lighting-fixtures-layer">
    <div class="pendant-light pendant-1">
      <div class="pendant-wire"></div>
      <div class="pendant-shade"></div>
