<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lutron Technician — Professional Master Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syncopate:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #07090e; --bg-card: rgba(18, 22, 33, 0.92); --amber-warm: #ffaa33; --qs-blue: #00d2ff; --led-green: #10b981; --text-main: #f3f4f6; --text-muted: #8a94a6; --border-light: rgba(255, 255, 255, 0.08); --glass-border: rgba(255, 255, 255, 0.15); --fixture-color: #ffaa00; --fixture-glow: rgba(255, 170, 0, 0.65); --beam-opacity: 0.85; }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); position: relative; }
    /* SCENERY & CURTAINS - STABLE */
    .outdoor-scenery { position: absolute; inset: 0; z-index: 1; overflow: hidden; transition: background 2s ease-in-out; }
    .outdoor-scenery.day-mode { background: linear-gradient(180deg, #1d4ed8 0%, #1e3a8a 50%, #0f172a 100%); }
    .outdoor-scenery.night-mode { background: radial-gradient(circle at 78% 22%, #090d16 0%, #020617 100%); }
    .sky-sun { position: absolute; top: 12%; right: 28%; width: 100px; height: 100px; border-radius: 50%; z-index: 1; background: radial-gradient(circle, #ffffff 20%, #fef08a 60%, #eab308 100%); box-shadow: 0 0 50px #facc15; opacity: 0.55; }
    .sky-moon { position: absolute; top: 12%; right: 28%; width: 60px; height: 60px; border-radius: 50%; z-index: 1; display: none; box-shadow: -15px 5px 0 0 #fef08a; background: transparent; filter: drop-shadow(0 0 20px rgba(254, 240, 138, 0.4)); }
    .outdoor-scenery.night-mode .sky-moon { display: block; }
    .mountain-layer { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; pointer-events: none; z-index: 3; }
    .mountain-back { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; fill: #1e3a8a; opacity: 0.25; }
    .mountain-front { position: absolute; bottom: 0; left: 0; width: 100%; height: 75%; fill: #0f172a; opacity: 0.65; }
    .curtain-container { position: absolute; inset: 0; z-index: 4; pointer-events: none; display: flex; width: 100%; height: 100%; overflow: hidden; }
    .curtain-panel { width: 50%; height: 100%; background: linear-gradient(180deg, #181d28 0%, #0e121a 50%, #07090e 100%); position: relative; box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.85); will-change: transform; }
    .curtain-pleats { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0px, rgba(0, 0, 0, 0.5) 20px, rgba(255, 255, 255, 0.07) 40px, rgba(0, 0, 0, 0.65) 60px); }
    .curtain-track-rod { position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: linear-gradient(180deg, #374151, #111827); z-index: 5; }
    .app-container { position: relative; z-index: 10; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 1.8rem 4vw 9.5rem 4vw; pointer-events: none; }
    .app-container > * { pointer-events: auto; }
    .sidebar-drawer { position: absolute; left: -310px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; z-index: 40; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .sidebar-drawer.open { transform: translateY(-50%) translateX(310px); }
    .palladiom-frame { width: 260px; height: auto; background: linear-gradient(145deg, #2a2f3d, #12151f); border-radius: 12px; padding: 12px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9); border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; gap: 8px; }
    .sidebar-trigger-tab { background: rgba(18, 22, 33, 0.95); border: 1px solid var(--glass-border); border-left: none; color: var(--amber-warm); padding: 1.2rem 0.6rem; border-radius: 0 10px 10px 0; font-family: 'JetBrains Mono', monospace; cursor: pointer; writing-mode: vertical-rl; }
    .keypad-btn { height: 42px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 4px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; color: rgba(255, 255, 255, 0.65); width: 100%; cursor: pointer; }
    .keypad-btn.active { color: #ffffff; background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.3); }
    .player-wrapper { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); width: calc(100% - 2rem); max-width: 870px; z-index: 100; }
    .glass-player { background: var(--bg-card); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 18px; padding: 0.8rem 1.2rem; }
    /* CONNECT SHEET */
    .spotify-connect-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px); z-index: 300; display: none; align-items: flex-end; justify-content: center; }
    .spotify-connect-overlay.open { display: flex; }
    .spotify-connect-sheet { width: 100%; max-width: 500px; background: #121622; border-radius: 24px 24px 0 0; padding: 20px 24px 35px 24px; color: #fff; }
    .device-item { padding: 12px; background: rgba(255,255,255,0.05); margin-top: 5px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="spotify-connect-overlay" id="connectOverlay">
    <div class="spotify-connect-sheet">
      <div style="display:flex; justify-content:space-between;"><span>Select Device</span><button id="closeSheetBtn" style="background:none; border:none; color:#fff;">✖</button></div>
      <div id="networkStatusHeader" style="margin:10px 0; font-size:0.75rem;"></div>
      <div id="networkDeviceListContainer"></div>
    </div>
  </div>

  <div class="outdoor-scenery day-mode" id="outdoorScenery">
    <div class="sky-sun"></div><div class="sky-moon" id="skyMoon"></div>
  </div>

  <div class="app-container">
    <header class="top-header"><div class="status-badge"><span id="processorStatusText">SCENE: AMBIENT</span></div></header>
    <h1 class="main-title">LUTRON TECHNICIAN</h1>
    <main class="central-stage">
      <div class="sidebar-drawer" id="sidebarDrawer">
        <div class="palladiom-frame">
          <button class="keypad-btn" data-scene="bright">01 BRIGHT</button>
          <button class="keypad-btn active" data-scene="warm">03 AMBIENT</button>
          <button class="keypad-btn" id="shadesBtn">05 DRAPERY</button>
        </div>
        <button class="sidebar-trigger-tab" id="sidebarTriggerBtn">SCENES</button>
      </div>
    </main>
    <div class="player-wrapper">
      <div class="glass-player">
        <button id="streamTvBtn" style="padding:10px; background:var(--qs-blue); border:none; border-radius:8px;">📡 STREAM TV</button>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Force Rescan logic
    function checkNetworkSinks() {
      const header = document.getElementById('networkStatusHeader');
      const listContainer = document.getElementById('networkDeviceListContainer');
      header.innerHTML = `DISCOVERING... <span onclick="checkNetworkSinks()" style="color:var(--amber-warm); cursor:pointer;">[FORCE RESCAN]</span>`;
      listContainer.innerHTML = `
        <div class="device-item" onclick="selectAudioSink('Amolak Echo Dot')">🔊 Amolak Echo Dot</div>
        <div class="device-item" onclick="selectAudioSink('Living Room')">🔊 Living Room</div>
        <div class="device-item" onclick="selectAudioSink('PPC A9')">🔊 PPC's A9</div>
        <div class="device-item" onclick="selectAudioSink('Studio R')">📡 Studio R</div>
      `;
    }
    function selectAudioSink(d) { alert(`⚡ Linked to ${d}`); document.getElementById('connectOverlay').classList.remove('open'); }
    
    document.getElementById('streamTvBtn').onclick = () => { document.getElementById('connectOverlay').classList.add('open'); checkNetworkSinks(); };
    document.getElementById('closeSheetBtn').onclick = () => document.getElementById('connectOverlay').classList.remove('open');
    document.getElementById('sidebarTriggerBtn').onclick = () => document.getElementById('sidebarDrawer').classList.toggle('open');
    // ... baki sab function waisa hi hai ...
  </script>
</body>
</html>
