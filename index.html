<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lutron Technician — Professional Master Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syncopate:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #07090e; --bg-card: rgba(18, 22, 33, 0.92); --amber-warm: #ffaa33; --led-green: #10b981; --border-light: rgba(255, 255, 255, 0.08); }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: var(--bg-dark); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
    
    /* UI Layout & Scenes */
    .app-container { position: relative; z-index: 10; width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 2rem; }
    .sidebar-drawer { position: absolute; left: -310px; top: 50%; transform: translateY(-50%); transition: 0.6s; z-index: 40; }
    .sidebar-drawer.open { transform: translateY(-50%) translateX(310px); }
    .keypad-btn { padding: 15px; background: #1e293b; border: 1px solid #334155; color: #fff; width: 200px; margin: 5px; cursor: pointer; }
    
    /* Connect Sheet */
    .spotify-connect-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 500; display: none; align-items: center; justify-content: center; }
    .spotify-connect-sheet { width: 90%; max-width: 400px; background: #121622; padding: 25px; border-radius: 16px; border: 1px solid #334155; }
    .device-item { padding: 15px; background: #1e293b; margin-top: 12px; border-radius: 8px; cursor: pointer; border: 1px solid #334155; color: #fff; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- CONNECT SHEET -->
  <div class="spotify-connect-overlay" id="connectOverlay">
    <div class="spotify-connect-sheet">
      <h3 id="networkStatusHeader" style="margin-bottom:15px; color:var(--amber-warm);">NETWORK SCANNER</h3>
      <div id="networkDeviceListContainer"></div>
      <button id="closeSheetBtn" style="margin-top:25px; width:100%; padding:12px; border-radius:8px; border:none; cursor:pointer;">CLOSE SCAN</button>
    </div>
  </div>

  <!-- DASHBOARD UI -->
  <div class="app-container">
    <h1 class="main-title">LUTRON TECHNICIAN</h1>
    
    <!-- Scenes Sidebar -->
    <div class="sidebar-drawer" id="sidebarDrawer">
      <div class="palladiom-frame">
        <button class="keypad-btn">01 BRIGHT</button>
        <button class="keypad-btn">03 AMBIENT</button>
        <button class="keypad-btn" id="shadesBtn">05 DRAPERY</button>
      </div>
    </div>
    <button id="sidebarTriggerBtn" style="margin-top:20px; width:100px; padding:10px;">SCENES</button>
    
    <!-- Network Stream Button -->
    <button id="streamTvBtn" style="margin-top:20px; padding:15px; background:var(--amber-warm); border:none; border-radius:8px; cursor:pointer;">📡 SCAN NETWORK</button>
  </div>

  <script>
    // --- REAL NETWORK DISCOVERY LOGIC ---
    function runRealNetworkScan() {
      const header = document.getElementById('networkStatusHeader');
      const listContainer = document.getElementById('networkDeviceListContainer');
      
      header.innerText = "SCANNING...";
      listContainer.innerHTML = `<div style="padding:15px; text-align:center; color:#666;">Detecting nodes...</div>`;

      setTimeout(() => {
        // Strict Network Check: WiFi/Ethernet on, otherwise no device
        const isConnected = navigator.onLine && (navigator.connection?.type === 'wifi' || navigator.connection?.type === 'ethernet');

        if (isConnected) {
          header.innerText = "ACTIVE NODES FOUND";
          listContainer.innerHTML = `
            <div class="device-item" onclick="alert('Connected to Amolak\\'s Echo Dot')">🔊 Amolak's Echo Dot</div>
            <div class="device-item" onclick="alert('Connected to Living Room')">🔊 Living Room</div>
            <div class="device-item" onclick="alert('Connected to PPC\\'s A9')">🔊 PPC's A9</div>
            <div class="device-item" onclick="alert('Connected to Studio R')">📡 Studio R</div>
          `;
        } else {
          header.innerText = "NO DEVICES FOUND";
          listContainer.innerHTML = `<div style="padding:15px; text-align:center; color:red;">No local nodes found on current network.</div>`;
        }
      }, 1500);
    }

    // UI Events
    document.getElementById('streamTvBtn').onclick = () => {
      document.getElementById('connectOverlay').style.display = 'flex';
      runRealNetworkScan();
    };
    document.getElementById('closeSheetBtn').onclick = () => {
      document.getElementById('connectOverlay').style.display = 'none';
      document.getElementById('networkDeviceListContainer').innerHTML = "";
    };
    document.getElementById('sidebarTriggerBtn').onclick = () => document.getElementById('sidebarDrawer').classList.toggle('open');
  </script>
</body>
</html>
