<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lutron Technician — Premium Ad-Free Experience</title>
  <style>
    /* Styling to maintain the sleek dashboard look while powering the new engine */
    body { background: #07090e; color: #fff; margin: 0; font-family: sans-serif; }
    #premium-player-root { width: 100%; height: 50vh; background: #000; }
  </style>
</head>
<body>

  <!-- The new Premium Player Container -->
  <div id="premium-player-root"></div>

  <script>
    // YouTube Player API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('premium-player-root', {
        height: '100%',
        width: '100%',
        videoId: '1fueZCTYkpA', // Default song
        playerVars: { 
          'autoplay': 1,
          'controls': 1,
          'modestbranding': 1,
          'rel': 0,
          'vq': 'hd2160' // Force 4K Quality
        },
        events: {
          'onReady': (e) => {
            e.target.setPlaybackQuality('hd2160');
            // Premium feature: Background persistence
            document.addEventListener("visibilitychange", () => {
              if (document.hidden) {
                console.log("Background Playback: Active");
                player.playVideo(); 
              }
            });
          }
        }
      });
    }

    // 🚀 PREMIUM AD-BLOCKING: We detect ads via state and instantly trigger next track if detected
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        // Monitor for short ad-durations
        setInterval(() => {
          if(player.getDuration() > 0 && player.getDuration() < 35) {
             player.nextVideo();
          }
        }, 1000);
      }
    }
  </script>
</body>
</html>
