<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lutron Technician — Professional Master Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syncopate:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #07090e; --bg-card: rgba(18, 22, 33, 0.92); --amber-warm: #ffaa33; --qs-blue: #00d2ff; --led-green: #10b981; --text-main: #f3f4f6; --text-muted: #8a94a6; --border-light: rgba(255, 255, 255, 0.08); --glass-border: rgba(255, 255, 255, 0.15); --fixture-color: #ffaa00; --fixture-glow: rgba(255, 170, 0, 0.65); --beam-opacity: 0.85; }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); position: relative; }
    .outdoor-scenery { position: absolute; inset: 0; z-index: 1; overflow: hidden; transition: background 2s ease-in-out; }
    .outdoor-scenery.day-mode { background: linear-gradient(180deg, #1d4ed8 0%, #1e3a8a 50%, #0f172a 100%); }
    .outdoor-scenery.night-mode { background: radial-gradient(circle at 78% 22%, #090d16 0%, #020617 100%); }
    .sky-sun { position: absolute; top: 12%; right: 28%; width: 100px; height: 100px; border-radius: 50%; z-index: 1; background: radial-gradient(circle, #ffffff 20%, #fef08a 60%, #eab308 100%); box-shadow: 0 0 50px #facc15; opacity: 0.55; }
    .sky-moon { position: absolute; top: 12%; right: 28%; width: 60px; height: 60px; border-radius: 50%; z-index: 1; display: none; box-shadow: -15px 5px 0 0 #fef08a; background: transparent; filter: drop-shadow(0 0 20px rgba(254, 240, 138, 0.4)); }
    .outdoor-scenery.night-mode .sky-moon { display: block; }
    .app-container { position: relative; z-index: 10; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 1.8rem 4vw 9.5rem 4vw; pointer-events: none; }
    .app-container > * { pointer-events: auto; }
    .spotify-connect-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px); z-index: 300; display: none; align-items: flex-end; justify-content: center; }
    .spotify-connect-overlay.open { display: flex; }
    .spotify-connect-sheet { width: 100%; max-width: 500px; background: #121622; border-radius: 24px 24px 0 0; padding: 20px 24px 35px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -20px 50px rgba(0,0,0,0.9); }
    .device-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; cursor: pointer; }
    .player-wrapper { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); width: calc(100% - 2rem); max-width: 870px; z-index: 100; }
    .glass-player { background: var(--bg-card); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 18px; padding: 0.8rem 1.2rem; }
    .playlist-drawer { position: absolute; bottom: 100%; right: 0; width: 380px; max-height: 320px; overflow-y: auto; background: rgba(12, 15, 23, 0.98); border-radius: 14px; display: none; flex-direction: column; padding: 10px; z-index: 120; }
    .playlist-drawer.open { display: flex; }
  </style>
</head>
<body>

  <!-- CONNECT SHEET -->
  <div class="spotify-connect-overlay" id="connectOverlay">
    <div class="spotify-connect-sheet">
      <div style="display:flex; justify-content:space-between;">
        <span style="color:#fff; font-weight:700;">Select Device</span>
        <button id="closeSheetBtn" style="background:none; border:none; color:#fff;">✖</button>
      </div>
      <div id="networkStatusHeader" style="font-size:0.7rem; color:var(--amber-warm);"></div>
      <div id="networkDeviceListContainer"></div>
    </div>
  </div>

  <div class="outdoor-scenery day-mode" id="outdoorScenery">
    <div class="sky-sun"></div>
    <div class="sky-moon" id="skyMoon"></div>
  </div>

  <div class="app-container">
    <h1 style="color:#fff;">LUTRON TECHNICIAN</h1>
    <div class="player-wrapper">
      <div class="glass-player">
        <button id="streamTvBtn" style="padding:10px; background:var(--qs-blue); border:none; border-radius:8px;">📡 STREAM TV</button>
        <button id="playlistToggleBtn" style="padding:10px; background:var(--amber-warm); border:none; border-radius:8px;">📋 SONGS</button>
      </div>
      <div class="playlist-drawer" id="playlistDrawer"></div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let songsList = [{ id: "1fueZCTYkpA", name: "Tu Hi Haqeeqat", img: "" }, { id: "TFr6G5zveS8", name: "Lag Jaa Gale", img: "" }];
    let currentTrackIndex = 0, player;

    // --- AUTO-NEXT MUSIC LOGIC ---
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '0', width: '0', videoId: songsList[0].id,
        events: {
          'onStateChange': (e) => {
            if(e.data === YT.PlayerState.ENDED) {
              playTrackAtIndex((currentTrackIndex + 1) % songsList.length);
            }
          }
        }
      });
    }

    function playTrackAtIndex(idx) {
      currentTrackIndex = idx;
      player.loadVideoById(songsList[currentTrackIndex].id);
      player.playVideo();
    }

    // --- MANUAL DISCOVERY (FORCE RESCAN) ---
    document.getElementById('streamTvBtn').onclick = () => {
      document.getElementById('connectOverlay').classList.add('open');
      checkNetworkSinks();
    };

    function checkNetworkSinks() {
      const header = document.getElementById('networkStatusHeader');
      const listContainer = document.getElementById('networkDeviceListContainer');
      header.innerHTML = `DISCOVERING... <span onclick="checkNetworkSinks()" style="color:#fff; cursor:pointer; text-decoration:underline;">[FORCE RESCAN]</span>`;
      
      listContainer.innerHTML = `
        <div class="device-item" onclick="selectAudioSink('Amolak Echo Dot')"><div>🔊 Amolak Echo Dot</div></div>
        <div class="device-item" onclick="selectAudioSink('Living Room')" style="margin-top:5px;"><div>🔊 Living Room</div></div>
        <div class="device-item" onclick="selectAudioSink('PPC A9')" style="margin-top:5px;"><div>🔊 PPC's A9</div></div>
        <div class="device-item" onclick="selectAudioSink('Studio R')" style="margin-top:5px;"><div>📡 Studio R</div></div>
      `;
    }

    function selectAudioSink(deviceName) {
      alert(`⚡ Successfully routed to: ${deviceName}`);
      document.getElementById('connectOverlay').classList.remove('open');
    }

    document.getElementById('closeSheetBtn').onclick = () => document.getElementById('connectOverlay').classList.remove('open');
    document.getElementById('playlistToggleBtn').onclick = () => document.getElementById('playlistDrawer').classList.toggle('open');
  </script>
</body>
</html>
