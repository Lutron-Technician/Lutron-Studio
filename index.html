<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lutron Technician — Professional Master Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syncopate:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #07090e; --bg-card: rgba(18, 22, 33, 0.92); --amber-warm: #ffaa33; --led-green: #10b981; --border-light: rgba(255, 255, 255, 0.08); }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: var(--bg-dark); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
    .app-container { position: relative; z-index: 10; width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 2rem; }
    .sidebar-drawer { position: absolute; left: -310px; top: 50%; transform: translateY(-50%); transition: 0.6s; z-index: 40; }
    .sidebar-drawer.open { transform: translateY(-50%) translateX(310px); }
    .keypad-btn { padding: 15px; background: #1e293b; border: 1px solid #334155; color: #fff; width: 200px; margin: 5px; cursor: pointer; }
    .spotify-connect-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500; display: none; align-items: center; justify-content: center; }
    .spotify-connect-sheet { width: 90%; max-width: 400px; background: #121622; padding: 20px; border-radius: 12px; }
    .device-item { padding: 15px; background: #1e293b; margin-top: 10px; border-radius: 8px; cursor: pointer; color: #fff; }
  </style>
</head>
<body>

  <!-- CONNECT SHEET -->
  <div class="spotify-connect-overlay" id="connectOverlay">
    <div class="spotify-connect-sheet">
      <h3>Select Network Device</h3>
      <div id="networkDeviceListContainer"></div>
      <button id="closeSheetBtn" style="margin-top:20px; width:100%; padding:10px;">CLOSE</button>
    </div>
  </div>

  <!-- DASHBOARD UI -->
  <div class="app-container">
    <h1 class="main-title">LUTRON TECHNICIAN</h1>
    <div class="sidebar-drawer" id="sidebarDrawer">
      <div class="palladiom-frame">
        <button class="keypad-btn" onclick="applyScene('bright')">01 BRIGHT</button>
        <button class="keypad-btn" onclick="applyScene('warm')">03 AMBIENT</button>
        <button class="keypad-btn" id="shadesBtn">05 DRAPERY</button>
      </div>
    </div>
    <button id="sidebarTriggerBtn" style="width:50px;">SCENES</button>
    <button id="streamTvBtn" style="margin-top:20px; padding:15px; background:var(--amber-warm);">📡 SCAN NETWORK</button>
  </div>

  <script>
    // Network Discovery Logic (Strict Check)
    function checkNetworkSinks() {
      const list = document.getElementById('networkDeviceListContainer');
      const isOnline = navigator.onLine;
      
      // Strict Check: List tabhi dikhegi agar browser online hai
      if (isOnline) {
        list.innerHTML = `
          <div class="device-item" onclick="selectAudioSink('Medium Cylinder')">🔊 Medium Cylinder</div>
          <div class="device-item" onclick="selectAudioSink('Sphere 360')">📽️ Sphere 360</div>
          <div class="device-item" onclick="selectAudioSink('Studio R')">📡 Studio R</div>
        `;
      } else {
        list.innerHTML = `<p style="color:red; padding:10px;">❌ No Network Detected. Connect to Wi-Fi.</p>`;
      }
    }

    function selectAudioSink(d) {
      alert(`⚡ Linked to ${d}`);
      document.getElementById('connectOverlay').style.display = 'none';
    }

    // Event Listeners
    document.getElementById('streamTvBtn').onclick = () => { document.getElementById('connectOverlay').style.display = 'flex'; checkNetworkSinks(); };
    document.getElementById('closeSheetBtn').onclick = () => document.getElementById('connectOverlay').style.display = 'none';
    document.getElementById('sidebarTriggerBtn').onclick = () => document.getElementById('sidebarDrawer').classList.toggle('open');
    
    // Auto-Next Logic
    function playNext() { console.log("Next song playing..."); }
    // Add logic here for player onStateChange ended -> playNext()
  </script>
</body>
</html>
